version: 2
updates:
  - package-ecosystem: gomod
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    target-branch: dev
    directory: /spinifex/runtime/roles/spinifexui/frontend
    schedule:
      interval: weekly
      day: sunday
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Base images are pinned by digest, so this is what moves them. The golang
  # version is deliberate and changes with go.mod; only its digest moves here.
  - package-ecosystem: docker
    target-branch: dev
    directories:
      - /build
      - /scripts
      - /docs/terraform-workbooks/demo-app
    schedule:
      interval: weekly
      day: sunday
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: golang
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      docker-images:
        patterns:
          - "*"
