name: E2E Cloud Vendor Vultr

# On demand only. Deploys a ref to Vultr with deploy-vultr.sh, runs the same
# published Terraform workbooks as the hypervisor nightly and OCI, and destroys
# the deployment, failing if anything is left billing.
on:
  workflow_dispatch:
    inputs:
      nodes:
        description: "1 or 3 nodes"
        required: false
        default: "1"
        type: choice
        options: ["1", "3"]
      plan:
        description: "Vultr plan: vx1-g-16c-64g (VM) or vbm-8c-64gb-amd (bare metal)"
        required: false
        default: vx1-g-16c-64g
      region:
        description: "Vultr region"
        required: false
        default: ord
      workbooks:
        description: "Space-separated workbooks (blank = the driver's full list)"
        required: false
      source:
        description: "tree (build this ref) or release (the published installer)"
        required: false
        default: tree
        type: choice
        options: [tree, release]
      channel:
        description: "With source=release: latest, or dev for the newest prerelease"
        required: false
        default: latest
      keep_on_fail:
        description: "Leave a failed deployment up to inspect. It keeps billing."
        required: false
        type: boolean
        default: false
      runner:
        description: "Runner label (blank = the VULTR_E2E_RUNNER variable, else ubuntu-26.04)"
        required: false

permissions:
  contents: read

# Deployments are named per run, but the account's reserved-IP quota is shared,
# so a second dispatch queues rather than competing with the first.
concurrency:
  group: e2e-vultr
  cancel-in-progress: false

jobs:
  vultr:
    # Hosted by default: the job only drives Terraform and SSH. The API key's
    # access control must admit this runner, so a hosted runner needs a key
    # whose list holds 0.0.0.0/0; a self-hosted runner can use a fixed address.
    runs-on: ${{ inputs.runner || vars.VULTR_E2E_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 240
    env:
      VULTR_NAME: e2e-${{ github.run_id }}
      VULTR_NODES: ${{ inputs.nodes }}
      VULTR_PLAN: ${{ inputs.plan }}
      VULTR_REGION: ${{ inputs.region }}
      VULTR_SOURCE: ${{ inputs.source }}
      VULTR_CHANNEL: ${{ inputs.channel }}
      VULTR_ARTIFACT_DIR: ${{ github.workspace }}/e2e-vultr
      SPX_REF: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: spinifex
          fetch-depth: 0

      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: mulga

      # build-install-artifacts.sh lives in mulga; the workbooks and their driver
      # are in spinifex, so only the one directory is needed here.
      - uses: actions/checkout@v7.0.1
        with:
          repository: mulgadc/mulga
          path: mulga
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: scripts/tofu-cluster

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false

      - name: Run Vultr
        working-directory: spinifex/scripts/terraform/vultr-spx
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          MULGA_ROOT: ${{ github.workspace }}/mulga
          # Through the environment, never interpolated into the script: a
          # dispatch input is untrusted text to the shell.
          WORKBOOKS_INPUT: ${{ inputs.workbooks }}
          VULTR_KEEP_ON_FAIL: ${{ inputs.keep_on_fail && '1' || '0' }}
        run: |
          set -uo pipefail
          if [ -n "$WORKBOOKS_INPUT" ]; then export WORKBOOKS="$WORKBOOKS_INPUT"; fi
          ./e2e-vultr.sh 2>&1 | tee "$RUNNER_TEMP/e2e-vultr.log"
          exit "${PIPESTATUS[0]}"

      # always(): a cancelled or timed-out job is the one that would leave
      # servers and reserved IPs billing. destroy works from this run's state.
      - name: Sweep anything left behind
        if: always() && !inputs.keep_on_fail
        working-directory: spinifex/scripts/terraform/vultr-spx
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: ./e2e-vultr.sh --sweep-only

      - name: Publish the verdict
        if: always()
        run: |
          {
            echo "### Vultr: ${VULTR_NODES} x ${VULTR_PLAN} in ${VULTR_REGION}, ${VULTR_SOURCE} build of ${SPX_REF}"
            echo '```'
            cat "$VULTR_ARTIFACT_DIR/verdict.txt" 2>/dev/null || echo "no verdict written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Logs and the verdict only. The throwaway SSH key and the Terraform state
      # under ~/.spinifex never reach an artifact.
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-vultr-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e2e-vultr.log
            ${{ github.workspace }}/e2e-vultr/*.log
            ${{ github.workspace }}/e2e-vultr/verdict.txt
          retention-days: 14
