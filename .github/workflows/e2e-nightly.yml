name: E2E Nightly

on:
  schedule:
    - cron: "0 14 * * 0-4" # 00:00 Mon-Fri AEST = 14:00 Sun-Thu UTC
  workflow_dispatch:
    inputs:
      cells:
        description: "Comma-separated cell numbers to run, no spaces (blank = all). 1-19 tofu matrix, 20 baremetal, 21-22 ISO, 23 predastore throughput"
        required: false

permissions:
  contents: read
  # actions: read lets the "Resolve CI job id" step below look up this job's
  # numeric id via the Actions API — github.job is only the YAML key, no
  # context exposes the id itself.
  actions: read

# Scheduled runs are loaded from the default branch (main), so the schedule
# trigger must stay in sync on main for cron to fire.
env:
  GIT_BRANCH: ${{ github.event_name == 'schedule' && 'dev' || github.ref_name }}
  UBUNTU_GOLD_IMAGE: /mnt/disk1/gold-images/spinifex-image-builder-ubuntu-26.04.qcow2
  # OTLP export to the central Elastic sink (wattle). Repo variable overrides;
  # empty string disables telemetry entirely.
  SPINIFEX_OTLP_ENDPOINT: ${{ vars.SPINIFEX_OTLP_ENDPOINT || 'http://192.168.1.13:8200' }}
  SPINIFEX_OTEL_ATTRS: ci.run_id=${{ github.run_id }},ci.workflow=${{ github.workflow }}

jobs:
  matrix:
    name: "cell-${{ matrix.cell }} (${{ matrix.topo }}/${{ matrix.net }}/${{
      matrix.host }}${{ matrix.extra && format('/{0}', matrix.extra) || '' }})"
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { cell: 1,  install: binary, topo: single,     net: dhcp,   host: debian-13,    arch: x86_64, runner: ci-single, extra: "" }
          - { cell: 2,  install: binary, topo: single,     net: static, host: ubuntu-26.04, arch: x86_64, runner: ci-single, extra: "" }
          - { cell: 3,  install: binary, topo: single,     net: dhcp,   host: ubuntu-26.04, arch: x86_64, runner: ci-single, extra: "" }
          - { cell: 8,  install: binary, topo: real-multi, net: dhcp,   host: debian-13,    arch: x86_64, runner: ci-multi,  extra: "" }
          - { cell: 9,  install: binary, topo: real-multi, net: static, host: ubuntu-26.04, arch: x86_64, runner: ci-multi,  extra: "" }
          - { cell: 10, install: binary, topo: real-multi, net: dhcp,   host: ubuntu-26.04, arch: x86_64, runner: ci-multi,  extra: "" }
          - { cell: 17, install: binary, topo: single,     net: static, host: debian-13,    arch: x86_64, runner: ci-pseudo, extra: "tofu-examples" }
          - { cell: 18, install: binary, topo: single,     net: static, host: debian-13,    arch: x86_64, runner: ci-single, extra: "reboot-single" }
          - { cell: 19, install: binary, topo: single,     net: nat,    host: debian-13,    arch: x86_64, runner: ci-single, extra: "nat-single" }

    runs-on: [ self-hosted, "${{ matrix.runner }}" ]
    timeout-minutes: ${{ matrix.extra == 'tofu-examples' && 45 || 35 }}
    env:
      TOFU_LOG: /tmp/e2e-nightly-cell-${{ matrix.cell }}-${{ github.run_id }}.log
      ARTIFACT_DIR: /tmp/spinifex-e2e-nightly-cell-${{ matrix.cell }}-${{ github.run_id }}
      # Job-level env wins over the workflow-level default above, so telemetry
      # from this cell carries ci.cell/ci.matrix. Nine cells run under one
      # run id and every cell names its hosts node1/node2/node3, so without
      # this every cell's telemetry collapses into one unattributable bucket.
      SPINIFEX_OTEL_ATTRS: ci.run_id=${{ github.run_id }},ci.workflow=${{ github.workflow }},ci.cell=${{ matrix.cell }},ci.matrix=${{ matrix.topo }}/${{ matrix.net }}/${{ matrix.host }}

    steps:
      # blank or scheduled run = full matrix.
      # Input must be comma-separated with no whitespace (e.g. '1,2,17', not '1, 2').
      - name: Gate on Dispatch Input
        id: gate
        env:
          CELL: ${{ matrix.cell }}
          CELLS: ${{ github.event_name == 'workflow_dispatch' && inputs.cells || '' }}
        run: |
          if [ -z "$CELLS" ] || [[ ",${CELLS}," == *",${CELL},"* ]]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
            echo "cell ${CELL} selected"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "cell ${CELL} not in '${CELLS}' — subsequent steps will skip"
          fi

      - name: Clean Workspace
        if: steps.gate.outputs.selected == 'true'
        run: |
          sudo umount -R -l /var/cache/spinifex-iso-builder/rootfs 2>/dev/null || true
          if [ ! -c /dev/null ]; then sudo rm -f /dev/null; sudo mknod -m 666 /dev/null c 1 3; fi
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/*

      - uses: actions/create-github-app-token@v3
        if: steps.gate.outputs.selected == 'true'
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: mulga

      - uses: actions/checkout@v7
        if: steps.gate.outputs.selected == 'true'
        with:
          repository: mulgadc/mulga
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: scripts/tofu-cluster
          path: mulga

      - uses: actions/checkout@v7
        if: steps.gate.outputs.selected == 'true'
        with:
          path: spinifex

      # Nine cells share one run id and every cell names its hosts
      # node1/node2/node3, so ci.cell above separates them and ci.job_id here
      # links each cell's telemetry to the job log that produced it. Runs
      # before Bootstrap bakes SPINIFEX_OTEL_ATTRS into the VM's telemetry.env.
      - name: Resolve CI job id
        if: steps.gate.outputs.selected == 'true'
        uses: ./spinifex/.github/actions/otel-job-id
        with:
          job-name: "cell-${{ matrix.cell }} (${{ matrix.topo }}/${{ matrix.net }}/${{ matrix.host }}${{ matrix.extra && format('/{0}', matrix.extra) || '' }})"

      - name: Build Install Artifacts
        if: steps.gate.outputs.selected == 'true'
        working-directory: mulga/scripts/tofu-cluster
        run: |
          ./build-install-artifacts.sh "${GIT_BRANCH}" \
            "${RUNNER_TEMP}/spinifex-distro.tar.gz" \
            "${RUNNER_TEMP}/setup.sh" \
            "${RUNNER_TEMP}/spinifex-tests.tar"

      - name: Provision VMs
        if: steps.gate.outputs.selected == 'true'
        working-directory: mulga/scripts/tofu-cluster
        env:
          MATRIX_HOST: ${{ matrix.host }}
        run: |
          export TF_VAR_git_branch="${GIT_BRANCH}"

          # Match the family, not a pinned version: an exact match silently stops
          # overriding the image when the matrix bumps release, dropping the cell
          # back onto the debian gold.
          TOFU_VAR_ARGS=""
          case "$MATRIX_HOST" in
            ubuntu-*) TOFU_VAR_ARGS="-var=host_image_override=${UBUNTU_GOLD_IMAGE}" ;;
          esac

          tofu init -input=false >> "$TOFU_LOG" 2>&1
          tofu workspace select -or-create "${SPINIFEX_CI_ENV}" >> "$TOFU_LOG" 2>&1
          tofu destroy -var-file=envs/${SPINIFEX_CI_ENV}.tfvars ${TOFU_VAR_ARGS} -auto-approve -input=false >> "$TOFU_LOG" 2>&1 || true
          ./scrub-env.sh "${SPINIFEX_CI_ENV}" >> "$TOFU_LOG" 2>&1 || true
          tofu apply -var-file=envs/${SPINIFEX_CI_ENV}.tfvars ${TOFU_VAR_ARGS} -auto-approve -input=false >> "$TOFU_LOG" 2>&1

      - name: Bootstrap via Binary Install
        if: steps.gate.outputs.selected == 'true'
        working-directory: mulga/scripts/tofu-cluster
        env:
          MATRIX_NET: ${{ matrix.net }}
        run: |
          if [ "$MATRIX_NET" = "nat" ]; then
            # Routed-NAT mode with a static public pool: exercises both the
            # Tier-1 transit datapath and the Tier-2 EIP ingress lane.
            export SPX_EXTERNAL_MODE=nat
            export SPX_EXTERNAL_POOL="${SPINIFEX_CI_POOL}"
          elif [ "$MATRIX_NET" = "dhcp" ]; then
            unset SPX_EXTERNAL_POOL
            export SPX_EXTERNAL_SOURCE=dhcp
          else
            export SPX_EXTERNAL_POOL="${SPINIFEX_CI_POOL}"
          fi

          ./bootstrap-install.sh "${SPINIFEX_CI_ENV}" \
            "${RUNNER_TEMP}/setup.sh" \
            "${RUNNER_TEMP}/spinifex-distro.tar.gz" \
            --test-tar "${RUNNER_TEMP}/spinifex-tests.tar"

      - name: Run Single Node E2E
        if: steps.gate.outputs.selected == 'true' && matrix.topo == 'single' && matrix.extra == ''
        working-directory: mulga/scripts/tofu-cluster
        run: |
          set -euo pipefail
          # Nightly runs a documented subset of the single-node set; the assert
          # fails the cell if that subset ever names a suite this topology
          # cannot fully exercise.
          . "${GITHUB_WORKSPACE}/spinifex/.github/scripts/suite-sets.sh"
          e2e_suites_assert_subset "e2e-nightly single" "${E2E_SUITES_NIGHTLY_SINGLE}" "${E2E_SUITES_SINGLE}"

          INVENTORY=$(tofu output -json inventory)
          WAN_IP=$(echo "$INVENTORY" | jq -r '.nodes[0].wan_ip')
          SSH_KEY=$(echo "$INVENTORY" | jq -r '.ssh_key_path')
          SSH_KEY="${SSH_KEY/#\~/$HOME}"
          ssh -tt -o StrictHostKeyChecking=no -i "$SSH_KEY" tf-user@${WAN_IP} \
            "set -u; mkdir -p '${ARTIFACT_DIR}'; cd \$HOME/e2e-tests/_bin; FAIL=0; \
             for SUITE in ${E2E_SUITES_NIGHTLY_SINGLE}; do \
               echo \"::group::suite \$SUITE\"; \
               date -u +%Y-%m-%dT%H:%M:%SZ > '${ARTIFACT_DIR}/test-'\$SUITE'.start'; \
               GITHUB_ACTIONS=true FORCE_COLOR=1 SPINIFEX_E2E=1 SPINIFEX_MODE=single \
                 ARTIFACT_DIR='${ARTIFACT_DIR}' \
                 ./\$SUITE.test -test.v -test.timeout=30m \
                 2>&1 | tee '${ARTIFACT_DIR}/test-'\$SUITE'.log'; \
               rc=\${PIPESTATUS[0]}; echo \"::endgroup::\"; \
               if [ \$rc -ne 0 ]; then echo \"\$SUITE: FAILED\" >> '${ARTIFACT_DIR}/suite-status.txt'; FAIL=1; fi; \
             done; exit \$FAIL"

      - name: Run NAT Uplink E2E
        if: steps.gate.outputs.selected == 'true' && matrix.extra == 'nat-single'
        working-directory: mulga/scripts/tofu-cluster
        # Skips cleanly (exit 0) when the tested branch predates the natuplink
        # suite so scheduled runs against dev stay green until the merge lands.
        run: |
          INVENTORY=$(tofu output -json inventory)
          WAN_IP=$(echo "$INVENTORY" | jq -r '.nodes[0].wan_ip')
          SSH_KEY=$(echo "$INVENTORY" | jq -r '.ssh_key_path')
          SSH_KEY="${SSH_KEY/#\~/$HOME}"
          ssh -tt -o StrictHostKeyChecking=no -i "$SSH_KEY" tf-user@${WAN_IP} \
            "set -u; mkdir -p '${ARTIFACT_DIR}'; cd \$HOME/e2e-tests/_bin; \
             if [ ! -f natuplink.test ]; then echo 'natuplink.test not in tests tar (branch predates suite) — skipping'; exit 0; fi; \
             echo '::group::suite natuplink'; \
             date -u +%Y-%m-%dT%H:%M:%SZ > '${ARTIFACT_DIR}/test-natuplink.start'; \
             GITHUB_ACTIONS=true FORCE_COLOR=1 SPINIFEX_E2E=1 SPINIFEX_MODE=single \
               ARTIFACT_DIR='${ARTIFACT_DIR}' \
               ./natuplink.test -test.v -test.timeout=30m \
               2>&1 | tee '${ARTIFACT_DIR}/test-natuplink.log'; \
             rc=\${PIPESTATUS[0]}; echo '::endgroup::'; \
             if [ \$rc -ne 0 ]; then echo 'natuplink: FAILED' >> '${ARTIFACT_DIR}/suite-status.txt'; fi; exit \$rc"

      - name: Run Multi Node E2E
        if: steps.gate.outputs.selected == 'true' && matrix.topo == 'real-multi'
        working-directory: mulga/scripts/tofu-cluster
        run: |
          set -euo pipefail
          # See the single-node step: same subset guard, multi-node set.
          . "${GITHUB_WORKSPACE}/spinifex/.github/scripts/suite-sets.sh"
          e2e_suites_assert_subset "e2e-nightly multi" "${E2E_SUITES_NIGHTLY_MULTI}" "${E2E_SUITES_MULTI}"

          INVENTORY=$(tofu output -json inventory)
          NODE1_IP=$(echo "$INVENTORY" | jq -r '.nodes[0].wan_ip')
          SSH_KEY=$(echo "$INVENTORY" | jq -r '.ssh_key_path')
          SSH_KEY="${SSH_KEY/#\~/$HOME}"

          NODES_CSV=""
          NODE_COUNT=$(echo "$INVENTORY" | jq '.nodes | length')
          for i in $(seq 0 $((NODE_COUNT - 1))); do
            ip=$(echo "$INVENTORY" | jq -r ".nodes[$i].wan_ip")
            NODES_CSV="${NODES_CSV:+$NODES_CSV,}$ip"
          done

          ssh -tt -o StrictHostKeyChecking=no -i "$SSH_KEY" tf-user@${NODE1_IP} \
            "set -u; mkdir -p '${ARTIFACT_DIR}'; cd \$HOME/e2e-tests/_bin; FAIL=0; \
             for SUITE in ${E2E_SUITES_NIGHTLY_MULTI}; do \
               echo \"::group::suite \$SUITE\"; \
               date -u +%Y-%m-%dT%H:%M:%SZ > '${ARTIFACT_DIR}/test-'\$SUITE'.start'; \
               GITHUB_ACTIONS=true FORCE_COLOR=1 SPINIFEX_E2E=1 SPINIFEX_MODE=multinode \
                 SPINIFEX_NODES='${NODES_CSV}' SPINIFEX_NODE_IPS='${NODES_CSV}' \
                 SPINIFEX_SSH_USER=tf-user SPINIFEX_SSH_KEY=\$HOME/.ssh/tf-user-ap-southeast-2 \
                 ARTIFACT_DIR='${ARTIFACT_DIR}' \
                 ./\$SUITE.test -test.v -test.timeout=30m \
                 2>&1 | tee '${ARTIFACT_DIR}/test-'\$SUITE'.log'; \
               rc=\${PIPESTATUS[0]}; echo \"::endgroup::\"; \
               if [ \$rc -ne 0 ]; then echo \"\$SUITE: FAILED\" >> '${ARTIFACT_DIR}/suite-status.txt'; FAIL=1; fi; \
             done; exit \$FAIL"

      - name: Import RDS PostgreSQL AMI
        if: steps.gate.outputs.selected == 'true' && matrix.extra == 'tofu-examples'
        working-directory: mulga/scripts/tofu-cluster
        run: |
          set -euo pipefail
          INVENTORY=$(tofu output -json inventory)
          WAN_IP=$(echo "$INVENTORY" | jq -r '.nodes[0].wan_ip')
          SSH_KEY=$(echo "$INVENTORY" | jq -r '.ssh_key_path')
          SSH_KEY="${SSH_KEY/#\~/$HOME}"
          ssh -o StrictHostKeyChecking=no -i "$SSH_KEY" tf-user@${WAN_IP} \
            "spx admin images import --name spinifex-rds-postgres"

      - name: Run Tofu Workbooks
        if: steps.gate.outputs.selected == 'true' && matrix.extra == 'tofu-examples'
        working-directory: mulga/scripts/tofu-cluster
        # The driver emits go test -v markers per workbook; teeing to
        # test-tofu.log feeds the same go-junit-report -> e2e-analyze -> upload
        # chain the Go suites use, so cell 17 produces an RCA bundle too.
        run: |
          set +e
          mkdir -p "${ARTIFACT_DIR}"
          INVENTORY=$(tofu output -json inventory)
          WAN_IP=$(echo "$INVENTORY" | jq -r '.nodes[0].wan_ip')
          SSH_KEY=$(echo "$INVENTORY" | jq -r '.ssh_key_path')
          SSH_KEY="${SSH_KEY/#\~/$HOME}"
          date -u +%Y-%m-%dT%H:%M:%SZ > "${ARTIFACT_DIR}/test-tofu.start"
          ssh -o StrictHostKeyChecking=no -i "$SSH_KEY" tf-user@${WAN_IP} \
            "cd ~/e2e-tests && ./run-tofu-examples-e2e.sh" \
            2>&1 | tee "${ARTIFACT_DIR}/test-tofu.log"
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then echo "tofu: FAILED" >> "${ARTIFACT_DIR}/suite-status.txt"; fi
          exit $rc

      - name: Run Reboot Resilience E2E
        if: steps.gate.outputs.selected == 'true' && matrix.extra == 'reboot-single'
        working-directory: mulga/scripts/tofu-cluster
        # reboot.test runs from the runner (NOT via ssh-and-run) so it survives the
        # systemctl-reboot-induced ssh disconnect mid-run.
        run: |
          set +e
          mkdir -p "${ARTIFACT_DIR}"
          INVENTORY=$(tofu output -json inventory)
          WAN_IP=$(echo "$INVENTORY" | jq -r '.nodes[0].wan_ip')
          SSH_KEY=$(echo "$INVENTORY" | jq -r '.ssh_key_path')
          SSH_KEY="${SSH_KEY/#\~/$HOME}"

          REBOOT_DIR="${RUNNER_TEMP}/reboot-e2e"
          mkdir -p "$REBOOT_DIR"
          tar xf "${RUNNER_TEMP}/spinifex-tests.tar" -C "$REBOOT_DIR"
          chmod +x "$REBOOT_DIR/_bin/reboot.test"

          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i "$SSH_KEY")
          CREDS=$(ssh "${SSH_OPTS[@]}" tf-user@${WAN_IP} 'cat ~/.aws/credentials')
          AWS_AK=$(echo "$CREDS" | awk -F '= *' '/^aws_access_key_id/ {print $2; exit}')
          AWS_SK=$(echo "$CREDS" | awk -F '= *' '/^aws_secret_access_key/ {print $2; exit}')
          echo "::add-mask::${AWS_AK}"; echo "::add-mask::${AWS_SK}"

          date -u +%Y-%m-%dT%H:%M:%SZ > "${ARTIFACT_DIR}/test-reboot.start"
          GITHUB_ACTIONS=true FORCE_COLOR=1 SPINIFEX_E2E=1 SPINIFEX_MODE=single \
            SPINIFEX_WAN_IP="${WAN_IP}" SPINIFEX_SSH_KEY="${SSH_KEY}" \
            SPINIFEX_AWS_ENDPOINT="https://${WAN_IP}:9999" \
            SPINIFEX_AWS_ACCESS_KEY_ID="${AWS_AK}" SPINIFEX_AWS_SECRET_ACCESS_KEY="${AWS_SK}" \
            ARTIFACT_DIR="${ARTIFACT_DIR}" \
            "$REBOOT_DIR/_bin/reboot.test" -test.v -test.timeout=30m \
            2>&1 | tee "${ARTIFACT_DIR}/test-reboot.log"
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then echo "reboot: FAILED" >> "${ARTIFACT_DIR}/suite-status.txt"; fi
          exit $rc

      - name: Collect e2e artifacts
        if: always() && steps.gate.outputs.selected == 'true'
        working-directory: mulga/scripts/tofu-cluster
        run: |
          set +e
          mkdir -p "${ARTIFACT_DIR}"
          INVENTORY=$(tofu output -json inventory 2>/dev/null) || { echo "no inventory; skipping"; exit 0; }
          SSH_KEY=$(echo "$INVENTORY" | jq -r '.ssh_key_path'); SSH_KEY="${SSH_KEY/#\~/$HOME}"
          NODE_COUNT=$(echo "$INVENTORY" | jq '.nodes | length')
          NODE1_IP=$(echo "$INVENTORY" | jq -r '.nodes[0].wan_ip')
          SSH_OPTS=(-o StrictHostKeyChecking=no -o ConnectTimeout=5 -i "$SSH_KEY")

          ssh "${SSH_OPTS[@]}" tf-user@${NODE1_IP} "tar -C '${ARTIFACT_DIR}' -cf - . 2>/dev/null || true" \
            | tar -C "${ARTIFACT_DIR}" -xf - 2>/dev/null

          for i in $(seq 0 $((NODE_COUNT - 1))); do
            IP=$(echo "$INVENTORY" | jq -r ".nodes[$i].wan_ip"); idx=$((i + 1))
            mkdir -p "${ARTIFACT_DIR}/vm-console-node${idx}"
            ssh "${SSH_OPTS[@]}" tf-user@${IP} 'sudo sh -c "cd /run/spinifex 2>/dev/null && tar -cf - console-*.log 2>/dev/null"' \
              | tar -C "${ARTIFACT_DIR}/vm-console-node${idx}" -xf - 2>/dev/null
            ssh "${SSH_OPTS[@]}" tf-user@${IP} 'sudo journalctl -u "spinifex-*" --no-pager --output=short-iso --since "60 min ago"' \
              > "${ARTIFACT_DIR}/spinifex-journal-node${idx}.log" 2>/dev/null
          done

          cat "${ARTIFACT_DIR}"/spinifex-journal-node*.log \
            > "${ARTIFACT_DIR}/spinifex-journal.log" 2>/dev/null || true
          echo "collected: $(ls "${ARTIFACT_DIR}" 2>/dev/null | wc -l) entries"

      - name: Install go-junit-report
        if: always() && steps.gate.outputs.selected == 'true'
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Convert test logs to JUnit XML
        if: always() && steps.gate.outputs.selected == 'true'
        run: |
          shopt -s nullglob
          for LOG in "${ARTIFACT_DIR}"/test-*.log; do
            BASE=$(basename "$LOG" .log); SUITE=${BASE#test-}
            go-junit-report -in "$LOG" -out "${ARTIFACT_DIR}/junit-${SUITE}.xml" || true
          done

      - name: Analyze e2e failures
        if: always() && steps.gate.outputs.selected == 'true'
        uses: ./spinifex/.github/actions/e2e-analyze
        with:
          junit-glob: ${{ env.ARTIFACT_DIR }}/junit-*.xml
          log-dir: ${{ env.ARTIFACT_DIR }}
          title: "E2E failure analysis (cell ${{ matrix.cell }})"

      - uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.selected == 'true'
        with:
          name: e2e-artifacts-cell-${{ matrix.cell }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Teardown
        if: always()
        working-directory: mulga/scripts/tofu-cluster
        env:
          MATRIX_HOST: ${{ matrix.host }}
        run: |
          # Must mirror the Provision step's override, or destroy runs against a
          # different image path than apply did.
          TOFU_VAR_ARGS=""
          case "$MATRIX_HOST" in
            ubuntu-*) TOFU_VAR_ARGS="-var=host_image_override=${UBUNTU_GOLD_IMAGE}" ;;
          esac
          tofu workspace select -or-create "${SPINIFEX_CI_ENV}" >> "$TOFU_LOG" 2>&1
          timeout 120 ./flush-telemetry.sh "${SPINIFEX_CI_ENV}" >> "$TOFU_LOG" 2>&1 || true
          tofu destroy -var-file=envs/${SPINIFEX_CI_ENV}.tfvars ${TOFU_VAR_ARGS} -auto-approve -input=false >> "$TOFU_LOG" 2>&1
          ./scrub-env.sh "${SPINIFEX_CI_ENV}" >> "$TOFU_LOG" 2>&1 || true

      - name: Upload tofu log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tofu-log-cell-${{ matrix.cell }}-${{ github.run_id }}
          path: ${{ env.TOFU_LOG }}
          if-no-files-found: ignore
          retention-days: 14

  # Bare-metal single-node suite. Doesn't fit the tofu matrix shape, so it
  # runs as a sibling job via the reusable e2e-baremetal workflow. Gated like a
  # matrix cell ("cell 20"): every weeknight cron, or dispatch with 20 selected
  # (blank cells = all). Tests `dev` on schedule to match GIT_BRANCH above.
  baremetal:
    name: cell-20 (baremetal/pxe/real-hw)
    if: >-
      github.event_name == 'schedule' ||
      inputs.cells == '' ||
      contains(format(',{0},', inputs.cells), ',20,')
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/e2e-baremetal.yml
    with:
      ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref_name }}
      # A reusable-workflow call gets none of this workflow's context (env:
      # above, matrix.cell) for free — cell-20 needs its own attrs string.
      # There's no matrix leg here, just the one fixed baremetal cell.
      otel-attrs: ci.run_id=${{ github.run_id }},ci.workflow=${{ github.workflow }},ci.cell=20,ci.matrix=baremetal/pxe/real-hw
    secrets: inherit

  # ISO cells. Unlike 1-19 these need no tofu: the harnesses run QEMU directly
  # on the runner. The nodes are therefore L1, which keeps the instances they
  # launch at L2 and their benchmark numbers comparable between the two cells.
  #
  # Serialised against each other because the guest MACs are fixed
  # (52:54:00:12:...): stable MACs are what make DHCP discovery work, and two
  # concurrent runs would put duplicates on the rack LAN, which is a confusing
  # failure for everyone on it, not just CI.
  iso-single:
    name: cell-21 (iso/dhcp/single)
    if: >-
      github.event_name == 'schedule' ||
      inputs.cells == '' ||
      contains(format(',{0},', inputs.cells), ',21,')
    runs-on: [self-hosted, ci-single]
    timeout-minutes: 45
    concurrency:
      group: iso-qemu-rack
      cancel-in-progress: false
    env:
      CI_WAN_MODE: dhcp
      CI_PASSWORD: ${{ secrets.BM_CI_PASSWORD }}
      # What a real node gets. The harness default of 4G is a dev-box size, and
      # importing an 820 MiB AMI on top of the running stack does not fit in it.
      MEM: 8G
      SMP: 8
      # .230 is consumed by the OVN router's SNAT, leaving .231-.234 for
      # instances. Disjoint from cell-22's pool so a run that dies holding its
      # SNAT address cannot collide with the next cell.
      EXT_POOL_START: 192.168.0.230
      EXT_POOL_END: 192.168.0.234
      EXT_GATEWAY: 192.168.1.1
      EXT_PREFIX_LEN: 23
    steps:
      - name: Clean Workspace
        run: |
          sudo umount -R -l /var/cache/spinifex-iso-builder/rootfs 2>/dev/null || true
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/*

      - name: Configure work directories
        run: |
          E2E_ROOT=/mnt/nvme/e2e
          mkdir -p "$E2E_ROOT/work" 2>/dev/null ||
            { sudo mkdir -p "$E2E_ROOT/work" && sudo chown "$(id -u):$(id -g)" "$E2E_ROOT" "$E2E_ROOT/work"; }
          echo "TMPDIR=$E2E_ROOT/work" >> "$GITHUB_ENV"

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: mulga

      - uses: actions/checkout@v7
        with:
          repository: mulgadc/mulga
          token: ${{ steps.app-token.outputs.token }}
          path: mulga

      - uses: actions/checkout@v7
        with:
          path: mulga/spinifex

      - name: Resolve sibling refs
        id: siblings
        env:
          BRANCH: ${{ github.event_name == 'schedule' && 'dev' || github.ref_name }}
        run: bash .github/resolve-sibling-refs.sh
        working-directory: mulga/spinifex

      - uses: actions/checkout@v7
        with:
          repository: mulgadc/viperblock
          ref: ${{ steps.siblings.outputs.viperblock }}
          path: mulga/viperblock

      - uses: actions/checkout@v7
        with:
          repository: mulgadc/predastore
          ref: ${{ steps.siblings.outputs.predastore }}
          path: mulga/predastore

      - uses: actions/checkout@v7
        with:
          repository: mulgadc/northstar
          ref: ${{ steps.siblings.outputs.northstar }}
          path: mulga/northstar

      - uses: actions/checkout@v7
        with:
          repository: mulgadc/bluebottle
          ref: ${{ steps.siblings.outputs.bluebottle }}
          path: mulga/bluebottle

      # Assert the host can do what the cell assumes, before spending 40
      # minutes finding out it cannot. A checklist in a plan doc goes stale;
      # this does not.
      - name: Preflight
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          ip link show "${BRIDGE:-br-wan}" >/dev/null ||
            { echo "::error::bridge br-wan not found on this runner"; exit 1; }
          grep -qE "^allow +${BRIDGE:-br-wan}$" /etc/qemu/bridge.conf ||
            { echo "::error::br-wan not permitted in /etc/qemu/bridge.conf"; exit 1; }
          command -v sshpass >/dev/null ||
            { echo "::error::sshpass not installed"; exit 1; }
          free_mb=$(free -m | awk '/^Mem:/ {print $7}')
          [ "$free_mb" -ge 8192 ] ||
            { echo "::error::need 8 GiB available, have ${free_mb} MiB"; exit 1; }
          # A 40G image on tmpfs competes with the 8 GiB the VM itself needs.
          fstype=$(df --output=fstype "$TMPDIR" | tail -1 | tr -d ' ')
          [ "$fstype" != tmpfs ] ||
            { echo "::error::$TMPDIR is tmpfs — the node disk would be in RAM"; exit 1; }
          df -h "$TMPDIR"
          avail_gb=$(df -BG --output=avail "$TMPDIR" | tail -1 | tr -dc '0-9')
          [ "$avail_gb" -ge 60 ] ||
            { echo "::error::need 60 GiB on $TMPDIR, have ${avail_gb} GiB"; exit 1; }

      - name: Build artefacts
        working-directory: mulga/scripts/iso-builder
        run: make build-rootfs build-squashfs build-initramfs

      # One key for both halves of the cell. test-workload.sh SSHes to the node
      # AND registers the same key as the EC2 key pair it uses to reach the
      # instances, so the key test-smoke.sh installs has to be that one — its
      # default ~/.ssh/id_*.pub would leave the workload step locked out.
      - name: Prepare SSH key
        run: |
          set -euo pipefail
          if [ ! -f "$HOME/.ssh/spinifex-key" ]; then
            mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
            ssh-keygen -t ed25519 -N "" -f "$HOME/.ssh/spinifex-key" -C "spinifex-ci"
          fi

      # Boots the ISO, installs unattended, reads the lease off the serial
      # console, runs the in-guest smoke test, and installs the key for the
      # next step.
      - name: Install and smoke test
        id: smoke
        working-directory: mulga/scripts/iso-builder
        run: |
          set -euo pipefail
          SSH_IDENTITY="$HOME/.ssh/spinifex-key.pub" \
            ./test/test-smoke.sh | tee /tmp/smoke-$GITHUB_RUN_ID.log
          ip=$(sed -n 's/^\[smoke\] node address: //p' /tmp/smoke-$GITHUB_RUN_ID.log | tail -1)
          [ -n "$ip" ] || { echo "::error::smoke test did not report a node address"; exit 1; }
          echo "node_ip=$ip" >> "$GITHUB_OUTPUT"

      # The customer path: AMI, key, VPC, instance, SSH in. --benchmark records
      # host and guest disk numbers so a regression shows up as a number rather
      # than a story.
      - name: Workload and benchmark
        working-directory: mulga/scripts/iso-builder
        run: |
          set -euo pipefail
          cat > /tmp/cell21.env <<EOF
          NODES=(${{ steps.smoke.outputs.node_ip }})
          NODE_NAMES=(spinifex-ci)
          SSH_USER=spinifex
          SSH_KEY_PATH=$HOME/.ssh/spinifex-key
          EXT_POOL_START=$EXT_POOL_START
          EXT_POOL_END=$EXT_POOL_END
          EXT_GATEWAY=$EXT_GATEWAY
          EXT_PREFIX_LEN=$EXT_PREFIX_LEN
          EOF
          ./test/test-workload.sh --env /tmp/cell21.env --benchmark

      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/cell21-artifacts-$GITHUB_RUN_ID
          cp -r /tmp/smoke-$GITHUB_RUN_ID.log /tmp/spinifex-disk-bench \
                /tmp/spinifex-network-bench /tmp/cell21-artifacts-$GITHUB_RUN_ID/ 2>/dev/null || true
          # The guest's own view. Without it a node that dies mid-test is only
          # visible as the harness command that stopped producing output.
          serial=$(sed -n 's/^\[smoke\] serial log preserved: //p' \
                   /tmp/smoke-$GITHUB_RUN_ID.log | tail -1)
          [ -n "$serial" ] && cp "$serial" /tmp/cell21-artifacts-$GITHUB_RUN_ID/serial.log || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-artifacts-cell-21-${{ github.run_id }}
          path: /tmp/cell21-artifacts-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14

      - name: Teardown
        if: always()
        working-directory: mulga/scripts/iso-builder
        run: |
          # No env file means the workload step never ran, so there is nothing
          # of its to clean up.
          if [ -f /tmp/cell21.env ]; then
            ./test/test-workload.sh --env /tmp/cell21.env --cleanup || true
          fi
          sudo pkill -f spinifex-smoke-test || true
          rm -rf /tmp/cell21-artifacts-$GITHUB_RUN_ID /tmp/cell21.env \
                 /tmp/smoke-$GITHUB_RUN_ID.log

  iso-multi:
    name: cell-22 (iso/dhcp/three-node)
    # After cell-21 rather than beside it: same concurrency group, and running
    # them together would need 32 GiB on one box.
    needs: [iso-single]
    if: >-
      always() && (
      github.event_name == 'schedule' ||
      inputs.cells == '' ||
      contains(format(',{0},', inputs.cells), ',22,') )
    runs-on: [self-hosted, ci-multi]
    timeout-minutes: 90
    concurrency:
      group: iso-qemu-rack
      cancel-in-progress: false
    env:
      MEM: 8G
      SMP: 8
      PASSWORD: ${{ secrets.BM_CI_PASSWORD }}
      EXT_POOL_START: 192.168.0.235
      EXT_POOL_END: 192.168.0.239
      EXT_GATEWAY: 192.168.1.1
      EXT_PREFIX_LEN: 23
    steps:
      - name: Clean Workspace
        run: |
          sudo umount -R -l /var/cache/spinifex-iso-builder/rootfs 2>/dev/null || true
          sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/*

      - name: Configure work directories
        run: |
          E2E_ROOT=/mnt/nvme/e2e
          mkdir -p "$E2E_ROOT/work" 2>/dev/null ||
            { sudo mkdir -p "$E2E_ROOT/work" && sudo chown "$(id -u):$(id -g)" "$E2E_ROOT" "$E2E_ROOT/work"; }
          echo "TMPDIR=$E2E_ROOT/work" >> "$GITHUB_ENV"

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: mulga

      - uses: actions/checkout@v7
        with:
          repository: mulgadc/mulga
          token: ${{ steps.app-token.outputs.token }}
          path: mulga

      - uses: actions/checkout@v7
        with:
          path: mulga/spinifex

      - name: Resolve sibling refs
        id: siblings
        env:
          BRANCH: ${{ github.event_name == 'schedule' && 'dev' || github.ref_name }}
        run: bash .github/resolve-sibling-refs.sh
        working-directory: mulga/spinifex

      - uses: actions/checkout@v7
        with:
          repository: mulgadc/viperblock
          ref: ${{ steps.siblings.outputs.viperblock }}
          path: mulga/viperblock

      - uses: actions/checkout@v7
        with:
          repository: mulgadc/predastore
          ref: ${{ steps.siblings.outputs.predastore }}
          path: mulga/predastore

      - uses: actions/checkout@v7
        with:
          repository: mulgadc/northstar
          ref: ${{ steps.siblings.outputs.northstar }}
          path: mulga/northstar

      - uses: actions/checkout@v7
        with:
          repository: mulgadc/bluebottle
          ref: ${{ steps.siblings.outputs.bluebottle }}
          path: mulga/bluebottle

      # 3 x 8 GiB plus 9 sparse 40G disks, before the instances the cluster
      # launches on top.
      - name: Preflight
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          free_mb=$(free -m | awk '/^Mem:/ {print $7}')
          [ "$free_mb" -ge 26624 ] ||
            { echo "::error::need 26 GiB available, have ${free_mb} MiB"; exit 1; }
          fstype=$(df --output=fstype "$TMPDIR" | tail -1 | tr -d ' ')
          [ "$fstype" != tmpfs ] ||
            { echo "::error::$TMPDIR is tmpfs — nine node disks would be in RAM"; exit 1; }
          df -h "$TMPDIR"
          avail_gb=$(df -BG --output=avail "$TMPDIR" | tail -1 | tr -dc '0-9')
          [ "$avail_gb" -ge 120 ] ||
            { echo "::error::need 120 GiB on $TMPDIR ($fstype), have ${avail_gb} GiB"; exit 1; }

      - name: Build artefacts
        working-directory: mulga/scripts/iso-builder
        run: make build-rootfs build-squashfs build-initramfs

      # Four phases: install three nodes, convert to one cluster, assert it
      # formed (including the external pool), then pull node 1's power and
      # assert the survivors hold quorum.
      #
      # Phase 5 (test-workload.sh, as cell-21 runs it) is not wired yet: the
      # nodes are still on user-mode NAT and reachable only through the
      # harness's own port forwards, and test-cluster.sh does not open the
      # formation port. Both land with mulga-yxtda and the bridged WAN mode;
      # until then this cell proves the cluster forms and survives, not that a
      # customer can use it.
      - name: Install, form and verify the cluster
        working-directory: mulga/scripts/iso-builder
        run: ./test/test-cluster.sh

      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/cell22-artifacts-$GITHUB_RUN_ID
          cp -r /tmp/spinifex-disk-bench /tmp/spinifex-network-bench \
                /tmp/cell22-artifacts-$GITHUB_RUN_ID/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-artifacts-cell-22-${{ github.run_id }}
          path: /tmp/cell22-artifacts-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14

      - name: Teardown
        if: always()
        run: |
          sudo pkill -f spinifex-cluster-test || true
          rm -rf /tmp/cell22-artifacts-$GITHUB_RUN_ID

  # Predastore throughput ("cell 23"). Predastore has no runners of its own and
  # spinifex depends on it, so the benchmark lives here and checks predastore
  # out as a sibling.
  #
  # needs: is the whole point. A throughput benchmark sharing a host with a cell
  # measures the neighbour, and ci-single and ci-multi both resolve to
  # bottlebrush, so "a different label" would not have separated them. needs: on
  # a matrix job waits for every leg, so this starts on a quiet machine.
  #
  # always() because a failed cell must not silently skip the benchmark and
  # leave a green-looking night with no number in it.
  performance:
    name: cell-23 (predastore/throughput)
    needs: [matrix, baremetal, iso-single, iso-multi]
    if: >-
      always() && (
      github.event_name == 'schedule' ||
      inputs.cells == '' ||
      contains(format(',{0},', inputs.cells), ',23,') )
    runs-on: [self-hosted, ci-single]
    timeout-minutes: 60
    env:
      # Two-minute samples. The 30s smoke preset is too short to compare nights.
      PERF_PRESET: compare
    steps:
      - name: Clean Workspace
        run: sudo rm -rf --one-file-system "$GITHUB_WORKSPACE"/*

      - name: Configure work directories
        run: |
          E2E_ROOT=/mnt/nvme/e2e
          mkdir -p "$E2E_ROOT/work" 2>/dev/null ||
            { sudo mkdir -p "$E2E_ROOT/work" && sudo chown "$(id -u):$(id -g)" "$E2E_ROOT" "$E2E_ROOT/work"; }
          echo "TMPDIR=$E2E_ROOT/work" >> "$GITHUB_ENV"
          echo "PERF_RESULTS_ROOT=$E2E_ROOT/predastore-perf-$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Checkout Spinifex
        uses: actions/checkout@v7
        with:
          path: spinifex

      # Which predastore branch to measure: the same-named branch when one
      # exists, dev otherwise. Matches how the e2e path already picks siblings,
      # so a cross-repo change is benchmarked as a set.
      - name: Resolve sibling refs
        id: siblings
        env:
          BRANCH: ${{ github.event_name == 'schedule' && 'dev' || github.ref_name }}
        run: bash .github/resolve-sibling-refs.sh
        working-directory: spinifex

      - name: Checkout Predastore
        uses: actions/checkout@v7
        with:
          repository: mulgadc/predastore
          ref: ${{ steps.siblings.outputs.predastore }}
          path: predastore

      # The benchmark works in $TMPDIR and predastore refuses writes below a 5%
      # free-space watermark. Without this the symptom is several hundred
      # "storage pool is at capacity" lines from warp and no statement of how
      # much space there actually was.
      #
      # TMPDIR is pointed at the runner's disk above, and the tmpfs assertion is
      # the one that matters: a storage benchmark on a RAM-backed filesystem
      # measures memcpy. It would report a number that looks excellent, sit in
      # the baseline, and never notice a disk regression.
      - name: Preflight
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          fstype=$(df --output=fstype "$TMPDIR" | tail -1 | tr -d ' ')
          case "$fstype" in
            tmpfs|ramfs)
              echo "::error::$TMPDIR is $fstype — a storage benchmark there measures RAM"
              exit 1 ;;
          esac
          # Work dirs from runs that were killed before their cleanup trap ran.
          # -mtime +0 so a concurrent run's directory is never in scope.
          find "$TMPDIR" -maxdepth 1 -name 'predastore-e2e-performance.*' \
               -type d -mtime +0 -exec rm -rf {} + 2>/dev/null || true
          df -h "$TMPDIR"
          avail_gb=$(df -BG --output=avail "$TMPDIR" | tail -1 | tr -dc '0-9')
          pct_used=$(df --output=pcent "$TMPDIR" | tail -1 | tr -dc '0-9')
          if [ "$pct_used" -ge 90 ] || [ "$avail_gb" -lt 20 ]; then
            echo "::error::$TMPDIR ($fstype) is ${pct_used}% full with ${avail_gb} GiB free."
            echo "::error::The benchmark needs headroom above predastore's 5% watermark."
            exit 1
          fi

      # PERF_PORT_OFFSET defaults to 10000, so the benchmark's own nodes do not
      # collide with a cluster left on the default ports.
      - name: Run throughput benchmark
        working-directory: predastore
        run: make e2e-performance

      # Report-only. The baseline comparison and the -10% gate are mulga-wpjsx;
      # until the run-to-run spread is known from real nights, a threshold would
      # be a guess, and a gate that cries wolf gets muted.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: predastore-perf-${{ github.run_id }}
          path: ${{ env.PERF_RESULTS_ROOT }}
          if-no-files-found: warn
          retention-days: 90

      - name: Clean up results
        if: always()
        run: rm -rf "$PERF_RESULTS_ROOT"
