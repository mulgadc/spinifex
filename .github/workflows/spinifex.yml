name: Build and Test

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/spinifex.yml
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes its run. Pushes and dispatches
# get a group of their own, so every commit on dev and main keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  # The unit tests run as four shards of one package list; Build and Test
  # merges their profiles and runs the coverage gates once, on the whole.
  unit:
    name: Unit Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout Spinifex
        uses: actions/checkout@v7.0.1
        with:
          path: spinifex

      - name: Go workspace
        uses: $/.github/actions/go-workspace
        with:
          siblings: branch
          cache: gobuild-unit-${{ matrix.shard }}
          cache-fallback: gobuild-build_and_test

      # The EBS provider contract suite needs a real implementation on each
      # side of the boundary: qemu-img/qemu-nbd/qemu-io back qemunbdd, which
      # shares no code with viperblock, and nbdkit plus viperblock's plugin
      # back viperblockd, the provider production actually uses. Without them
      # the suite runs against MemoryProvider alone. nbdkit-plugin-dev carries
      # the headers and nbdkit.pc that cgo needs to build that plugin, and
      # libnbd-bin supplies the third-party NBD client (nbdinfo/nbdcopy) that
      # judges the published export by something outside this codebase.
      - name: Install conformance tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils nbdkit nbdkit-plugin-dev libnbd-bin

      - name: Build viperblock nbdkit plugin
        run: make -C viperblock go_build_nbd

      - name: Select Packages
        run: |
          set -euo pipefail
          make -s -C spinifex list-test-pkgs > all-pkgs-${{ matrix.shard }}.txt
          spinifex/.github/scripts/go-pkg-shard.sh ${{ matrix.shard }} 4 \
            < all-pkgs-${{ matrix.shard }}.txt > pkgs-${{ matrix.shard }}.txt
          echo "shard ${{ matrix.shard }}/4: $(wc -l < pkgs-${{ matrix.shard }}.txt) of $(wc -l < all-pkgs-${{ matrix.shard }}.txt) packages"

      - name: Run Tests with Coverage
        env:
          SPINIFEX_REQUIRE_CONFORMANCE_TOOLS: "1"
          VIPERBLOCK_NBDKIT_PLUGIN: ${{ github.workspace }}/viperblock/lib/nbdkit-viperblock-plugin.so
        run: >-
          make -C spinifex test-cover-pkgs GOTESTFLAGS=-count=1
          PKGS_FILE=${{ github.workspace }}/pkgs-${{ matrix.shard }}.txt
          COVERPROFILE=${{ github.workspace }}/coverage-${{ matrix.shard }}.out

      - name: Upload Shard Results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-shard-${{ matrix.shard }}
          path: |
            all-pkgs-${{ matrix.shard }}.txt
            pkgs-${{ matrix.shard }}.txt
            coverage-${{ matrix.shard }}.out
          if-no-files-found: error
          retention-days: 3

      - name: Save Go build cache
        uses: $/.github/actions/go-build-cache-save
        with:
          cache: gobuild-unit-${{ matrix.shard }}

  build:
    name: Build
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Spinifex
        uses: actions/checkout@v7.0.1
        with:
          path: spinifex

      - name: Go workspace
        uses: $/.github/actions/go-workspace
        with:
          siblings: branch
          cache: gobuild-${{ github.job }}
          cache-fallback: gobuild-build_and_test

      # The headers and nbdkit.pc that cgo needs to build viperblock's plugin.
      - name: Install plugin build packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils nbdkit nbdkit-plugin-dev libnbd-bin

      - name: Build viperblock nbdkit plugin
        run: make -C viperblock go_build_nbd

      - name: Build Spinifex
        run: make -C spinifex build

      - name: Run Action Tests
        run: make -C spinifex test-actions GOTESTFLAGS=-count=1

      - name: Save Go build cache
        uses: $/.github/actions/go-build-cache-save
        with:
          cache: gobuild-${{ github.job }}

  # The required check. It passes only when every shard and the build passed,
  # the shards' packages are exactly the full list, and both coverage gates
  # pass on the merged profile.
  build_and_test:
    name: Build and Test
    needs: [unit, build]
    if: ${{ always() }}
    runs-on: ubuntu-26.04

    steps:
      - name: Require Every Shard and the Build
        env:
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          [ "$UNIT" = success ] || { echo "::error::Unit Tests: $UNIT"; exit 1; }
          [ "$BUILD" = success ] || { echo "::error::Build: $BUILD"; exit 1; }

      - name: Checkout Spinifex
        uses: actions/checkout@v7.0.1
        with:
          path: spinifex
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: spinifex/go.mod
          cache: false

      - name: Download Shard Results
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: unit-shard-*
          merge-multiple: true
          path: shards

      - name: Check the Shards Cover Every Package Once
        run: spinifex/.github/scripts/go-pkg-shard-union.sh shards/all-pkgs-*.txt -- shards/pkgs-*.txt

      - name: Merge Coverage Profiles
        run: |
          set -euo pipefail
          # Every shard's profile, by number: a missing one must fail, not shrink the total.
          for n in 1 2 3 4; do
            [ "$(head -1 "shards/coverage-${n}.out" 2>/dev/null)" = "mode: atomic" ] ||
              { echo "::error::shard ${n} has no atomic coverage profile"; exit 1; }
          done
          { echo "mode: atomic"; for n in 1 2 3 4; do tail -n +2 "shards/coverage-${n}.out"; done; } > spinifex/coverage.out
          grep -c '' spinifex/coverage.out

      - name: Check Total Coverage
        run: cd spinifex && scripts/check-coverage.sh coverage.out

      - name: Check Diff Coverage
        run: cd spinifex && scripts/diff-coverage.sh coverage.out --base HEAD~1

  race:
    name: Race Detection (${{ matrix.shard }}/4)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout Spinifex
        uses: actions/checkout@v7.0.1
        with:
          path: spinifex

      - name: Go workspace
        uses: $/.github/actions/go-workspace
        with:
          siblings: branch
          cache: gobuild-race-${{ matrix.shard }}
          cache-fallback: gobuild-race_detection

      - name: Select Packages
        run: |
          set -euo pipefail
          make -s -C spinifex list-test-pkgs > race-all-pkgs-${{ matrix.shard }}.txt
          spinifex/.github/scripts/go-pkg-shard.sh ${{ matrix.shard }} 4 \
            < race-all-pkgs-${{ matrix.shard }}.txt > race-pkgs-${{ matrix.shard }}.txt
          echo "shard ${{ matrix.shard }}/4: $(wc -l < race-pkgs-${{ matrix.shard }}.txt) of $(wc -l < race-all-pkgs-${{ matrix.shard }}.txt) packages"

      - name: Run Tests with Race Detector
        run: >-
          make -C spinifex test-race-pkgs GOTESTFLAGS=-count=1
          PKGS_FILE=${{ github.workspace }}/race-pkgs-${{ matrix.shard }}.txt

      - name: Upload Shard Packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: race-shard-${{ matrix.shard }}
          path: |
            race-all-pkgs-${{ matrix.shard }}.txt
            race-pkgs-${{ matrix.shard }}.txt
          if-no-files-found: error
          retention-days: 3

      - name: Save Go build cache
        uses: $/.github/actions/go-build-cache-save
        with:
          cache: gobuild-race-${{ matrix.shard }}

  # Required on main. Passes only when every race shard passed and the shards'
  # packages are exactly the full list.
  race_detection:
    name: Race Detection
    needs: race
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04

    steps:
      - name: Require Every Shard
        env:
          RACE: ${{ needs.race.result }}
        run: '[ "$RACE" = success ] || { echo "::error::Race Detection shards: $RACE"; exit 1; }'

      - name: Checkout Spinifex
        uses: actions/checkout@v7.0.1
        with:
          path: spinifex
          sparse-checkout: .github/scripts

      - name: Download Shard Packages
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: race-shard-*
          merge-multiple: true
          path: shards

      - name: Check the Shards Cover Every Package Once
        run: spinifex/.github/scripts/go-pkg-shard-union.sh shards/race-all-pkgs-*.txt -- shards/race-pkgs-*.txt

  lint:
    name: Lint and Govulncheck
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Spinifex
        uses: actions/checkout@v7.0.1
        with:
          path: spinifex

      - name: Go workspace
        uses: $/.github/actions/go-workspace
        with:
          siblings: branch
          cache: gobuild-${{ github.job }}

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          working-directory: spinifex

      - name: Govulncheck
        if: ${{ !cancelled() }}
        run: make -C spinifex govulncheck

      - name: Save Go build cache
        uses: $/.github/actions/go-build-cache-save
        with:
          cache: gobuild-${{ github.job }}

  integration:
    name: Integration
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Spinifex
        uses: actions/checkout@v7.0.1
        with:
          path: spinifex

      - name: Go workspace
        uses: $/.github/actions/go-workspace
        with:
          siblings: branch
          cache: gobuild-${{ github.job }}

      - name: Run Integration Tests
        run: make -C spinifex test-integration

      - name: Save Go build cache
        uses: $/.github/actions/go-build-cache-save
        with:
          cache: gobuild-${{ github.job }}

  gated:
    name: Gated Suites
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Spinifex
        uses: actions/checkout@v7.0.1
        with:
          path: spinifex

      - name: Go workspace
        uses: $/.github/actions/go-workspace
        with:
          siblings: branch
          cache: gobuild-${{ github.job }}

      - name: Run Gated Suites
        run: make -C spinifex test-gated GOTESTFLAGS=-count=1

      - name: Save Go build cache
        uses: $/.github/actions/go-build-cache-save
        with:
          cache: gobuild-${{ github.job }}
