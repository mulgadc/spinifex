name: Build and Test

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/spinifex.yml
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes its run. Pushes and dispatches
# get a group of their own, so every commit on dev and main keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Spinifex
        uses: actions/checkout@v7.0.1
        with:
          path: spinifex
          fetch-depth: 2

      - name: Go workspace
        uses: $/.github/actions/go-workspace
        with:
          siblings: branch
          cache: gobuild-${{ github.job }}

      # The EBS provider contract suite needs a real implementation on each
      # side of the boundary: qemu-img/qemu-nbd/qemu-io back qemunbdd, which
      # shares no code with viperblock, and nbdkit plus viperblock's plugin
      # back viperblockd, the provider production actually uses. Without them
      # the suite runs against MemoryProvider alone. nbdkit-plugin-dev carries
      # the headers and nbdkit.pc that cgo needs to build that plugin, and
      # libnbd-bin supplies the third-party NBD client (nbdinfo/nbdcopy) that
      # judges the published export by something outside this codebase.
      - name: Install conformance tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils nbdkit nbdkit-plugin-dev libnbd-bin

      - name: Build viperblock nbdkit plugin
        run: make -C viperblock go_build_nbd

      - name: Build Spinifex
        run: make -C spinifex build

      - name: Run Tests with Coverage
        env:
          SPINIFEX_REQUIRE_CONFORMANCE_TOOLS: "1"
          VIPERBLOCK_NBDKIT_PLUGIN: ${{ github.workspace }}/viperblock/lib/nbdkit-viperblock-plugin.so
        run: make -C spinifex test-cover GOTESTFLAGS=-count=1

      - name: Run Action Tests
        run: make -C spinifex test-actions GOTESTFLAGS=-count=1

      - name: Check Diff Coverage
        run: cd spinifex && scripts/diff-coverage.sh coverage.out --base HEAD~1

      - name: Save Go build cache
        uses: $/.github/actions/go-build-cache-save
        with:
          cache: gobuild-${{ github.job }}

  race_detection:
    name: Race Detection
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Spinifex
        uses: actions/checkout@v7.0.1
        with:
          path: spinifex

      - name: Go workspace
        uses: $/.github/actions/go-workspace
        with:
          siblings: branch
          cache: gobuild-${{ github.job }}

      - name: Run Tests with Race Detector
        run: make -C spinifex test-race GOTESTFLAGS=-count=1

      - name: Save Go build cache
        uses: $/.github/actions/go-build-cache-save
        with:
          cache: gobuild-${{ github.job }}

  lint:
    name: Lint and Govulncheck
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Spinifex
        uses: actions/checkout@v7.0.1
        with:
          path: spinifex

      - name: Go workspace
        uses: $/.github/actions/go-workspace
        with:
          siblings: branch
          cache: gobuild-${{ github.job }}

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          working-directory: spinifex

      - name: Govulncheck
        if: ${{ !cancelled() }}
        run: make -C spinifex govulncheck

      - name: Save Go build cache
        uses: $/.github/actions/go-build-cache-save
        with:
          cache: gobuild-${{ github.job }}

  integration:
    name: Integration
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Spinifex
        uses: actions/checkout@v7.0.1
        with:
          path: spinifex

      - name: Go workspace
        uses: $/.github/actions/go-workspace
        with:
          siblings: branch
          cache: gobuild-${{ github.job }}

      - name: Run Integration Tests
        run: make -C spinifex test-integration

      - name: Save Go build cache
        uses: $/.github/actions/go-build-cache-save
        with:
          cache: gobuild-${{ github.job }}

  gated:
    name: Gated Suites
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Spinifex
        uses: actions/checkout@v7.0.1
        with:
          path: spinifex

      - name: Go workspace
        uses: $/.github/actions/go-workspace
        with:
          siblings: branch
          cache: gobuild-${{ github.job }}

      - name: Run Gated Suites
        run: make -C spinifex test-gated GOTESTFLAGS=-count=1

      - name: Save Go build cache
        uses: $/.github/actions/go-build-cache-save
        with:
          cache: gobuild-${{ github.job }}
