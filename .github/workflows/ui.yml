name: UI Build and Test

on:
  push:
    branches:
      - main
      - dev
    paths:
      - spinifex/runtime/roles/spinifexui/frontend/**
      - .github/workflows/ui.yml
  pull_request:
    branches:
      - main
      - dev
    paths:
      - spinifex/runtime/roles/spinifexui/frontend/**
      - .github/workflows/ui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui_build_and_test:
    name: UI Build and Test
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: spinifex/runtime/roles/spinifexui/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: spinifex/runtime/roles/spinifexui/frontend

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: spinifex/runtime/roles/spinifexui/frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          cache: "pnpm"
          cache-dependency-path: spinifex/runtime/roles/spinifexui/frontend/pnpm-lock.yaml
          node-version-file: spinifex/runtime/roles/spinifexui/frontend/.nvmrc

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run Tests with Coverage
        run: pnpm test:coverage

      - name: Build Frontend
        run: pnpm build

      # spx embeds the committed dist/, so a bundle that differs from a clean
      # build of this source would ship JavaScript CI never built. Porcelain
      # rather than git diff, so added and deleted chunks count too.
      - name: Check for generated file drift
        run: |
          drift=$(git status --porcelain -- src/routeTree.gen.ts src/lib/cn-tables.gen.ts dist)
          if [ -n "$drift" ]; then
            echo "::error::Generated files differ from a clean build. Run pnpm build and commit the result."
            echo "$drift"
            exit 1
          fi

  # The pinned image lives in one file that scripts/ui-playwright.sh also reads,
  # so make ui-baselines and the job below draw screenshots in the same image.
  ui_e2e_image:
    name: UI End-to-End Image
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.read.outputs.image }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: spinifex/runtime/roles/spinifexui/frontend/playwright.image
          sparse-checkout-cone-mode: false

      - name: Read Playwright Image
        id: read
        run: echo "image=$(tr -d '[:space:]' < spinifex/runtime/roles/spinifexui/frontend/playwright.image)" >> "$GITHUB_OUTPUT"

  # The browser suite: the console against a faked API on Vite dev, plus the
  # built dist under the production CSP. It runs in Playwright's own image, which
  # carries the browsers, so screenshots rasterise as they did for the baselines.
  ui_e2e:
    name: UI End-to-End
    needs: ui_e2e_image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container:
      image: ${{ needs.ui_e2e_image.outputs.image }}
      options: --ipc=host
    defaults:
      run:
        working-directory: spinifex/runtime/roles/spinifexui/frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: spinifex/runtime/roles/spinifexui/frontend

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: spinifex/runtime/roles/spinifexui/frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          cache: "pnpm"
          cache-dependency-path: spinifex/runtime/roles/spinifexui/frontend/pnpm-lock.yaml
          node-version-file: spinifex/runtime/roles/spinifexui/frontend/.nvmrc

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # The image's browsers belong to one Playwright release, so a lockfile
      # bump without an image bump would otherwise fail on a missing executable.
      - name: Check Playwright Matches the Image
        env:
          IMAGE: ${{ needs.ui_e2e_image.outputs.image }}
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          case "$IMAGE" in
            *":v$version-"*) ;;
            *) echo "::error::Lockfile has Playwright $version but the image is $IMAGE. Update playwright.image."; exit 1 ;;
          esac

      - name: Build Frontend
        run: pnpm build

      - name: Run End-to-End Suite
        run: pnpm e2e

      - name: Upload Screenshot Diffs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-e2e-test-results
          path: spinifex/runtime/roles/spinifexui/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
