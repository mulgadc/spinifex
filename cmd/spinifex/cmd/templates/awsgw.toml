# AWS Gateway configuration file in TOML format.
version = "3"
region = "{{.Region}}"

# Enable verbose debugging
debug = false

# API request throttling (per-account, per-action token bucket)
[ratelimit]
enabled = false
rate = 20 # Default sustained requests per second per account per action
burst = 100 # Default maximum burst capacity

[ratelimit.action.RunInstances]
rate = 2
burst = 40

[ratelimit.action.TerminateInstances]
rate = 2
burst = 40

[ratelimit.action.StartInstances]
rate = 2
burst = 40

[ratelimit.action.StopInstances]
rate = 2
burst = 40

# API request throttling for self-service account creation.
[ratelimit.action.CreateAccount]
rate = 1
burst = 5

# Self-service account creation via POST /admin/CreateAccount.
# max_accounts caps how many accounts may exist; 0 means uncapped.
# console_url is returned to a new account as the place to sign in; set it to
# this cluster's console before enabling signup.
# The endpoint is unreachable until an IAM user in the super-admin account is
# granted spinifex:CreateAccount, so these values alone do not expose it.
[signup]
max_accounts = 128
console_url = ""

# Per-account service quotas (default off)
[quota]
enabled = false
vcpus = 8
vpcs = 8
subnets = 16
eips = 4
volumes_gib = 100
