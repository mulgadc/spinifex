# Predastore S3-compatible storage configuration file in TOML format.
# Single node: one host running every node in one process.
version = 1
region = "{{.Region}}"

# Reed-Solomon erasure code. data + parity must not exceed the number of blob
# nodes in the cluster.
# RS(2,1), 2 data, 1 parity. Minimum
# RS(3,2), 3 data, 2 parity. Recommended for production
[rs]
data = 2
parity = 1

# A host is one predastore process: it owns a data directory, a TLS identity
# and the nodes pinned to it. Everything is colocated here, so the nodes talk
# over the in-process pipe and only the gate binds a socket.
[[host]]
id = 1
bind_addr = "0.0.0.0"
addr = "127.0.0.1"
data_dir = "{{.PredastoreDataDir}}"
tls_cert = "{{.ConfigDir}}/server.pem"
tls_key = "{{.ConfigDir}}/server.key"
encryption_key = "{{.ConfigDir}}/predastore/encryption.key"

# The gate serves the S3 API. Without one the host answers no S3 request.
[[host.node]]
id = 1
role = "gate"
port = 8443

# Blob nodes hold erasure-coded object shards; a stripe spreads over distinct
# ones, so RS(2,1) needs 3. Colocated nodes bind no socket, but each still
# needs a port unique within its host.
[[host.node]]
id = 2
role = "blob"
port = 6660

[[host.node]]
id = 3
role = "blob"
port = 6661

[[host.node]]
id = 4
role = "blob"
port = 6662

# Meta nodes form the Raft quorum over global state (buckets, object index).
[[host.node]]
id = 5
role = "meta"
port = 7660

[[host.node]]
id = 6
role = "meta"
port = 7661

[[host.node]]
id = 7
role = "meta"
port = 7662

[[bucket]]
name = "predastore"
region = "{{.Region}}"
public = false
account_id = "000000000000"

{{- if .NorthstarAccessKey}}
# Northstar DNS zone storage. Read-only for the northstar service; the control
# plane writes zone files with the system credentials.
[[bucket]]
name = "{{.NorthstarBucket}}"
region = "{{.Region}}"
public = false
account_id = "000000000000"
{{- end}}

[[auth]]
access_key_id = "{{.AccessKey}}"
secret_access_key = "{{.SecretKey}}"
account_id = "000000000000"
policy = [
  { bucket = "predastore", actions = ["s3:ListBucket",  "s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListAllMyBuckets"] },
{{- if .NorthstarAccessKey}}
  { bucket = "{{.NorthstarBucket}}", actions = ["s3:ListBucket", "s3:GetObject", "s3:PutObject", "s3:DeleteObject"] },
{{- end}}
]
{{- if .NorthstarAccessKey}}

# Bucket-scoped, read-only credentials for the northstar service (isolation
# guarantee: ListBucket + GetObject on the northstar bucket only).
[[auth]]
access_key_id = "{{.NorthstarAccessKey}}"
secret_access_key = "{{.NorthstarSecretKey}}"
account_id = "000000000000"
policy = [
  { bucket = "{{.NorthstarBucket}}", actions = ["s3:ListBucket", "s3:GetObject"] },
]
{{- end}}

# API request throttling (per-account, per-action token bucket)
[ratelimit]
enabled = false
rate = 100          # Default sustained requests per second per account per action
burst = 500         # Default maximum burst capacity

[ratelimit.action."s3:PutObject"]
rate = 50
burst = 200

[ratelimit.action."s3:DeleteObject"]
rate = 50
burst = 200

# IAM authentication via NATS KV (enables multi-account S3 access)
[iam]
nats_url = "nats://{{if eq .BindIP "0.0.0.0"}}localhost{{else}}{{.BindIP}}{{end}}:4222"
nats_token = "{{.NatsToken}}"
master_key_path = "{{.ConfigDir}}/master.key"
access_keys_bucket = "spinifex-iam-access-keys"
{{- if .CompactionIntervalSeconds}}

[compaction]
interval_seconds = {{.CompactionIntervalSeconds}}
{{- end}}
