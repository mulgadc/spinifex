# Predastore S3-compatible storage configuration file in TOML format.
# MULTI NODE used for testing
version = "5"
region = "{{.Region}}"

# The gateway listen address comes from the daemon CLI options: a top-level
# host key would collide with the [[host]] topology table below.

# Enable verbose debugging
debug = false

# Optionally configure base-path if full directory path not defined for "fs" buckets
# base_path = "/home/predastore/data/"

# Specify reed solomon encoding - 
# RS(2,1), 2 data, 1 parity. Minimum
# RS(3,2), 3 data, 2 parity. Recommended for production
[rs]
data = 2
parity = 1

# A host is one predastore process: it owns a socket and a data directory,
# and runs the nodes pinned to it. A single-node deployment declares one host
# and colocates every node in it, so all intra-cluster traffic goes over the
# in-process pipe and no socket is bound. bind_addr/public_addr are unused
# while everything is colocated; they only matter once nodes are split across
# processes.
[[host]]
id = 1
bind_addr = "127.0.0.1:6660"
public_addr = "127.0.0.1:6660"
data_dir = "{{.PredastoreDataDir}}"

# Shard nodes: the distributed hash ring places object shards across these.
# RS(2,1) needs 3.
[[node]]
id = 1
host_id = 1
role = "shard-storage"

[[node]]
id = 2
host_id = 1
role = "shard-storage"

[[node]]
id = 3
host_id = 1
role = "shard-storage"

# State replicas: the Raft quorum over global state (buckets, object index).
[[node]]
id = 4
host_id = 1
role = "state-replica"

[[node]]
id = 5
host_id = 1
role = "state-replica"

[[node]]
id = 6
host_id = 1
role = "state-replica"

[[buckets]]
name = "predastore"
region = "ap-southeast-2"
type = "distributed"
public = false
encryption = ""
account_id = "000000000000"

{{- if .NorthstarAccessKey}}
# Northstar DNS zone storage. Read-only for the northstar service; the control
# plane writes zone files with the system credentials.
[[buckets]]
name = "{{.NorthstarBucket}}"
region = "{{.Region}}"
type = "distributed"
public = false
encryption = ""
account_id = "000000000000"
{{- end}}

[[auth]]
access_key_id = "{{.AccessKey}}"
secret_access_key = "{{.SecretKey}}"
account_id = "000000000000"
policy = [
  { bucket = "predastore", actions = ["s3:ListBucket",  "s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListAllMyBuckets"] },
{{- if .NorthstarAccessKey}}
  { bucket = "{{.NorthstarBucket}}", actions = ["s3:ListBucket", "s3:GetObject", "s3:PutObject", "s3:DeleteObject"] },
{{- end}}
]
{{- if .NorthstarAccessKey}}

# Bucket-scoped, read-only credentials for the northstar service (isolation
# guarantee: ListBucket + GetObject on the northstar bucket only).
[[auth]]
access_key_id = "{{.NorthstarAccessKey}}"
secret_access_key = "{{.NorthstarSecretKey}}"
account_id = "000000000000"
policy = [
  { bucket = "{{.NorthstarBucket}}", actions = ["s3:ListBucket", "s3:GetObject"] },
]
{{- end}}

# API request throttling (per-account, per-action token bucket)
[ratelimit]
enabled = false
rate = 100          # Default sustained requests per second per account per action
burst = 500         # Default maximum burst capacity

[ratelimit.action."s3:PutObject"]
rate = 50
burst = 200

[ratelimit.action."s3:DeleteObject"]
rate = 50
burst = 200

# IAM authentication via NATS KV (enables multi-account S3 access)
[iam]
nats_url = "nats://{{if eq .BindIP "0.0.0.0"}}localhost{{else}}{{.BindIP}}{{end}}:4222"
nats_token = "{{.NatsToken}}"
nats_ca_cert = "{{.ConfigDir}}/ca.pem"
master_key_path = "{{.ConfigDir}}/master.key"
access_keys_bucket = "spinifex-iam-access-keys"
{{- if .CompactionIntervalSeconds}}

[compaction]
interval_seconds = {{.CompactionIntervalSeconds}}
{{- end}}