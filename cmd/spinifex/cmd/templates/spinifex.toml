# Domain configuration file in TOML format.
version = "4"
epoch = 1
node = "{{.Node}}"
{{- if .OperatorEmail}}

[operator]
email = "{{.OperatorEmail}}"
{{- end}}

[aws]
region = "{{.Region}}"
internal_suffix = "spinifex.internal"

[network]
ipsec_enabled = {{.IPSecEnabled}}
{{- if .ExternalMode}}
external_mode = "{{.ExternalMode}}"
{{- range .Pools}}

[[network.external_pools]]
name        = "{{.Name}}"
{{- if .Source}}
source      = "{{.Source}}"
{{- end}}
{{- if .BindBridge}}
bind_bridge = "{{.BindBridge}}"
{{- end}}
{{- if .DHCPMAC}}
dhcp_mac    = "{{.DHCPMAC}}"
{{- end}}
{{- if .Start}}
range_start = "{{.Start}}"
range_end   = "{{.End}}"
{{- end}}
{{- if .Gateway}}
gateway     = "{{.Gateway}}"
{{- end}}
{{- if .GatewayIP}}
gateway_ip  = "{{.GatewayIP}}"
{{- end}}
{{- if .GwLrpRangeStart}}
gw_lrp_range_start = "{{.GwLrpRangeStart}}"
gw_lrp_range_end   = "{{.GwLrpRangeEnd}}"
{{- end}}
prefix_len  = {{if .PrefixLen}}{{.PrefixLen}}{{else}}24{{end}}
{{- if .DNSServers}}
dns_servers = [{{range $i, $s := .DNSServers}}{{if $i}}, {{end}}"{{$s}}"{{end}}]
{{- end}}
{{- end}}
{{- end}}
{{- if .BootstrapVpcId}}

[bootstrap]
account_id  = "{{.BootstrapAccountId}}"
vpc_id      = "{{.BootstrapVpcId}}"
subnet_id   = "{{.BootstrapSubnetId}}"
igw_id      = "{{.BootstrapIgwId}}"
cidr        = "{{.BootstrapCidr}}"
subnet_cidr = "{{.BootstrapSubnetCidr}}"
{{- end}}

[nodes.{{.Node}}]
node = "{{.Node}}"
host = "{{.BindIP}}"
{{- if .AdvertiseIP}}
advertise = "{{.AdvertiseIP}}"
{{- end}}
region = "{{.Region}}"
az = "{{.Az}}"
data_dir = "{{.DataDir}}"
{{- if .Services}}
services = [{{range $i, $s := .Services}}{{if $i}}, {{end}}"{{$s}}"{{end}}]
{{- end}}

account_id = "{{.AccountID}}"

[nodes.{{.Node}}.daemon]
host = "{{.BindIP}}:{{.Port}}"
tlskey = "config/server.key"
tlscert = "config/server.pem"
{{- if .ExternalMode}}
dev_networking = false
{{- else}}
dev_networking = true
{{- end}}
{{- if .GPUPassthrough}}
gpu_passthrough = true
{{- end}}

[nodes.{{.Node}}.awsgw]
# Wildcard rather than the bind IP: the gateway is the public AWS-API surface and
# has to answer on the wan plane as well as internally, while --bind names only
# the internal plane. TLS + SigV4 gate it, and the ECR registry host falls back
# to the advertise address when the listener is unspecified.
host = "0.0.0.0:9999"
tlskey = "config/server.key"
tlscert = "config/server.pem"
debug = false
config = "awsgw/awsgw.toml"

[nodes.{{.Node}}.nats]
host = "{{.BindIP}}:4222"
cacert = "{{.ConfigDir}}/ca.pem"

[nodes.{{.Node}}.nats.acl]
token = "{{.NatsToken}}"

[nodes.{{.Node}}.nats.sub]

[nodes.{{.Node}}.viperblock]
shardwal = false
gc_enabled = true
{{- if .EncryptionKeyFile}}
encryption_key_file = "{{.EncryptionKeyFile}}"
{{- end}}

[nodes.{{.Node}}.ebs]
provider = "viperblockd"
# Per-volume export tunables. Both are applied per nbdkit process and there is
# one of those per volume, so the host cost of each is the value times the
# volume count. Uncomment to override; a service restart plus a volume
# detach/reattach is needed for either to take effect on an existing volume.
#
# default_threads: nbdkit -t, worker threads per NBD connection. QEMU opens one
# connection per volume, so this is the whole per-volume in-flight ceiling.
#default_threads = 16
#
# cache_size_mb: per-volume plaintext read cache. 0 disables it. Auxiliary -efi
# volumes are uncached regardless.
#cache_size_mb = 128

[nodes.{{.Node}}.vpcd]
ovn_nb_addr = "{{.OVNNBAddr}}"
ovn_sb_addr = "{{.OVNSBAddr}}"
{{- if .ExternalIface}}
external_interface = "{{.ExternalIface}}"
{{- end}}
{{- if .BridgeMode}}
bridge_mode = "{{.BridgeMode}}"
{{- end}}

[nodes.{{.Node}}.predastore]
# Wildcard rather than the bind IP: S3 is a public service and has to answer on
# the wan plane. This settles the gate node's own bind address and port, and
# nothing else: raft and blob traffic bind [[host]].bind_addr from
# predastore.toml, which is the private plane and stays there.
#
# This doubles as the local dial target, and 0.0.0.0 is not one: config loading
# rewrites it to 127.0.0.1 for this node, and admin.DialTarget does the same for
# callers that read it directly.
host = "0.0.0.0:8443"
region = "{{.Region}}"
bucket = "predastore"
accesskey = "{{.AccessKey}}"
secretkey = "{{.SecretKey}}"
{{- if gt .PredastoreHostID 0}}
host_id = {{.PredastoreHostID}}
{{- end}}

{{- if .NorthstarConfigPath}}

[nodes.{{.Node}}.northstar]
config_path = "{{.NorthstarConfigPath}}"
default_domain = "{{.NorthstarDefaultDomain}}"
internal_domain = "{{.NorthstarInternalDomain}}"
{{- end}}
{{- range .RemoteNodes}}

[nodes.{{.Name}}]
node = "{{.Name}}"
host = "{{.Host}}"
region = "{{.Region}}"
az = "{{.AZ}}"
{{- if .Services}}
services = [{{range $i, $s := .Services}}{{if $i}}, {{end}}"{{$s}}"{{end}}]
{{- end}}
{{- if .NorthstarConfigPath}}

[nodes.{{.Name}}.northstar]
config_path = "{{.NorthstarConfigPath}}"
{{- end}}
{{- end}}
