# ec2-node profile — what any guest that behaves like an EC2 instance needs,
# with nothing Kubernetes- or container-specific in it.
#
# This exists because mulga-ebs-byid is not an EKS concern despite having lived
# in eks-common: it mints the /dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_*
# links for hot-attached viperblock volumes, which is wanted by any image that
# attaches an EBS volume. A database image keeping its data directory on an
# attached volume wants it specifically. Leaving it in eks-common would have
# forced the next non-EKS image to either compose EKS profiles it does not want
# or re-author the base.
#
# Sources are referenced where they already live rather than copied in — the .sh
# helpers are shared verbatim with the Alpine image that still consumes them, so
# a copy here would be a second version to keep in step. The .service files sit
# under scripts/images/eks-node-gpu/ only because that is the one existing
# systemd image; they are neither GPU- nor EKS-specific, and they move into this
# tree when scripts/images/ is deleted at cutover.
[Content]
ExtraTrees=../../../scripts/images/eks-node/mulga-ebs-byid.sh:/usr/local/sbin/mulga-ebs-byid
           ../../../scripts/images/eks-node/mulga-mgmt-net.sh:/usr/local/sbin/mulga-mgmt-net
           ../../../scripts/images/eks-node-gpu/mulga-ebs-byid.service:/etc/systemd/system/mulga-ebs-byid.service
           ../../../scripts/images/eks-node-gpu/99-mulga-ebs-byid.rules:/etc/udev/rules.d/99-mulga-ebs-byid.rules
