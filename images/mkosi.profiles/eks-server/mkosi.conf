# eks-server profile — the K3s server (control-plane) side of an EKS node.
#
# Layered on eks-common (k3s binary + role-agnostic node services), over a base
# that already carries mulga-ebs-byid + mulga-mgmt-net (in practice only the
# dual-NIC control plane gets a management NIC). Composes with eks-agent into
# the unified spinifex-eks-node CPU image; the role (server|server-join|agent)
# is picked at first boot by eks-node-role, not baked. GPU control-plane images
# may compose this profile alone, without eks-agent.
#
# Every unit here ships, but only eks-node-role is baked enabled — the rest
# wait for the first-boot role selector to enable + start them, exactly as the
# legacy Alpine manifest's ENABLE_SERVICES did (only crond, eks-node-role,
# mulga-ebs-byid, mulga-eks-provider-id and mulga-vpc-mtu were baked; every
# role-specific server unit was left for eks-node-role.sh). The etcd-snapshot
# timers are the one exception: like crond before them, they are baked enabled
# unconditionally and the script self-guards on the agent role at runtime.
#
# staging/ holds the host-built binaries: the five in-repo ./cmd/... server
# binaries plus konnectivity-server, which is not in-repo and gets its own
# clone-and-build step in stage_profile_binaries() (scripts/mkosi-build.sh).
#
# Sources are referenced where they already live rather than copied in, same
# as eks-common/eks-agent: the .sh helpers are shared verbatim with
# the Alpine image that still consumes them, and the addon/coredns/
# konnectivity bundles are plain data no other profile needs to touch.
[Content]
ExtraTrees=../../staging/eks-server:/
           ../../../scripts/images/eks-node/eks-node-role.sh:/usr/local/sbin/eks-node-role
           ../../../scripts/images/eks-node/k3s-prestart.sh:/usr/local/sbin/k3s-prestart
           ../../../scripts/images/eks-node/k3s-first-boot.sh:/usr/local/sbin/k3s-first-boot
           ../../../scripts/images/eks-node/konnectivity-server-prestart.sh:/usr/local/sbin/konnectivity-server-prestart
           ../../../scripts/images/eks-node/mulga-eks-state-report.sh:/usr/local/sbin/mulga-eks-state-report
           ../../../scripts/images/eks-node/mulga-eks-addon-sync.sh:/usr/local/sbin/mulga-eks-addon-sync
           ../../../scripts/images/eks-node/mulga-eks-k3s-recovery.sh:/usr/local/sbin/mulga-eks-k3s-recovery
           ../../../scripts/images/eks-node/mulga-eks-etcd-snapshot.sh:/usr/local/sbin/mulga-eks-etcd-snapshot
           ../../../scripts/images/eks-node/cloud-init-ec2.cfg:/etc/cloud/cloud.cfg.d/99-spinifex-ec2-imds.cfg
           ../../../scripts/images/eks-node/addons:/usr/share/spinifex-eks/addons
           ../../../scripts/images/eks-node/coredns:/usr/share/spinifex-eks/coredns
           ../../../scripts/images/eks-node/konnectivity:/usr/share/spinifex-eks/konnectivity
