# gpu-amd profile — AMD GPU guest support (ROCm userland + amdgpu firmware),
# layered on the base image.
#
# Ports scripts/images/ubuntu-gpu-amd-setup.sh. Docker is deliberately NOT
# here, for a different reason than gpu-nvidia excludes it: AMD GPU
# containers reach the device through plain passthrough (`docker run
# --device=/dev/kfd --device=/dev/dri`), not a vendor container runtime, so
# there is no toolkit here for a GPU-conditional docker postinst branch to
# wire up. The standalone AMD GPU AMI still wants Docker — it gets it from
# the docker profile, composed alongside this one, same as gpu-nvidia.
[Content]
# linux-headers-generic matches whatever kernel linux-image-generic (base)
# pulled in. This deviates from the legacy script, which pins
# linux-headers-${KVER} to the exact kernel it detects in /boot or
# /lib/modules — that detection assumes a pre-existing installed kernel to
# introspect, which is meaningless in an mkosi build: the kernel here is
# whatever linux-image-generic resolves to at build time, so
# linux-headers-generic is the only pin that can't drift out of sync with it.
#
# amdgpu itself needs no DKMS build (unlike gpu-nvidia): it is upstreamed in
# the mainline kernel and ships inside linux-image-generic already. Headers
# are pulled in anyway to match the legacy image's package set for anything
# that shells out expecting them.
#
# linux-firmware carries the amdgpu firmware blobs the kernel module loads
# at runtime; linux-image-generic does not pull it in (WithRecommends=
# defaults off, matching --no-install-recommends), so it is named explicitly
# — this is the actual load-bearing package for GPU support, more so than
# ROCm userland below.
#
# initramfs-tools + pciutils + the python3 toolchain + ffmpeg/libgl1/
# libglib2.0-0 mirror the legacy ubuntu-gpu-amd-setup.sh supporting set
# one-for-one.
#
# curl/gnupg/ca-certificates are for mkosi.postinst.chroot, which adds the
# ROCm apt repository — it does not ship in the Ubuntu archive, so it cannot
# be pulled in via Packages= alone.
Packages=linux-headers-generic
         linux-firmware
         initramfs-tools
         pciutils
         python3
         python3-venv
         python3-pip
         ffmpeg
         libgl1
         libglib2.0-0
         curl
         gnupg
         ca-certificates

[Build]
# mkosi.postinst.chroot needs network access to add and install from the
# ROCm repository.
WithNetwork=yes
