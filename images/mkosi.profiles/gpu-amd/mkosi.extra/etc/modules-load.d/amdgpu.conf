# Load amdgpu at boot so /dev/kfd and /dev/dri exist before anything that
# expects them (ROCm CLI tools, a passed-through container workload) runs.
#
# This is belt-and-braces rather than strictly load-bearing the way
# nvidia.conf is for gpu-nvidia: amdgpu is an in-tree driver with a normal
# PCI ID table, so udev's modalias matching should autoload it on its own
# when the passed-through device is enumerated — unlike the proprietary
# nvidia module, which historically needs an explicit trigger because
# nothing on a headless node otherwise probes for it. The explicit entry
# here removes any dependence on that autoload path actually firing in a
# VFIO passthrough guest, which has not been verified on real AMD hardware.
# It costs nothing on a boot with no GPU present: modprobe of a valid
# in-tree module that finds no matching device is a no-op, not a failure.
amdgpu
