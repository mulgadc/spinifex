# rds-common profile — the engine-agnostic half of an RDS instance VM.
#
# Composes as base + rds-common + rds-<engine>. Per-engine values reach the
# units below as drop-ins from the engine profile, so nothing here names an
# engine. mulga-ebs-byid and mulga-mgmt-net come from the base.
[Content]
# util-linux carries blkid, which rds-datadir treats as a hard requirement: it
# refuses to run rather than risk formatting a customer's datadir on a guess.
Packages=ca-certificates
         util-linux
         e2fsprogs
         xfsprogs

# staging/ carries the Go binary built on the host — see eks-agent for why it
# is not built in the builder container. The two shell helpers stay beside
# their test suites rather than under mkosi.extra/.
ExtraTrees=../../staging/rds-common:/
           rds-datadir:/usr/local/sbin/rds-datadir
           rds-bootstrap-wait:/usr/local/sbin/rds-bootstrap-wait
