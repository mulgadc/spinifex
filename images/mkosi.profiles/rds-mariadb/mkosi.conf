# rds-mariadb profile — the MariaDB half of an RDS instance VM.
#
# Composes as base + rds-common + rds-mariadb, in that order: this profile's
# postinst asserts against files rds-common delivers.
[Content]
# No `=~11.8` pin as on Alpine: Ubuntu 26.04 carries 11.8 in main and its SRU
# policy holds the series for the release's life. The postinst asserts the
# installed series instead, which also catches what a pin cannot — a rebuild
# against a different release.
Packages=mariadb-server
         mariadb-client

# default-parameters.cnf is build-time only; the postinst validates it against
# this image's own server and then deletes it.
ExtraTrees=rds-init:/usr/local/sbin/rds-init
           default-parameters.cnf:/usr/local/share/spinifex-rds/default-parameters.cnf
