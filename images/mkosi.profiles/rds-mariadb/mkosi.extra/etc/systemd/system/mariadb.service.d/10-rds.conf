# The direct analogue of the Alpine preset's rc_need="rds-init", and it matters
# for the same reason: the packaged server only WARNS on an empty or invalid
# datadir and starts anyway, so ordering alone would let it serve an empty
# database that passes every health probe.
#
# The packaged unit is kept rather than replaced — unlike postgresql-common's
# wrapper it carries no registry, reads the datadir straight out of the option
# files rds-init writes onto the data volume, and its Type=notify readiness is
# worth more than a hand-written unit.
[Unit]
Requires=rds-init.service
After=rds-init.service
