# This image's layout, stated here because rds-datadir is shared by every
# engine profile and refuses to guess one.
#
# EnvironmentFile= MUST stay below Environment=: systemd applies them in
# declaration order and the later assignment wins, which is what lets the
# control plane move the mount point without rebuilding the image. Inverted,
# the image default silently beats the delivered value.
[Service]
Environment=RDS_DATA_MOUNT=/var/lib/mysql RDS_ENGINE_USER=mysql
EnvironmentFile=-/etc/spinifex-rds/agent.env
