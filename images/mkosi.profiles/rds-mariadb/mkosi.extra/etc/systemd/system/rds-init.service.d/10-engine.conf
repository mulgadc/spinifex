# Ubuntu's engine paths, declared rather than edited into a 1000-line bootstrap
# script: rds-init already honours every one of these as an override.
# RDS_MARIADBD is the one that must be set — the clients are in /usr/bin on
# both distributions, but Debian and Ubuntu ship the server in /usr/sbin.
#
# EnvironmentFile= stays below Environment= so a delivered value still wins.
[Service]
Environment=RDS_DATA_MOUNT=/var/lib/mysql RDS_ENGINE_USER=mysql
Environment=RDS_MARIADB_BIN=/usr/bin
Environment=RDS_MARIADBD=/usr/sbin/mariadbd
EnvironmentFile=-/etc/spinifex-rds/agent.env

[Unit]
Before=mariadb.service
