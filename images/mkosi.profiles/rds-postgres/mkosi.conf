# rds-postgres profile — the PostgreSQL half of an RDS instance VM.
#
# Composes as base + rds-common + rds-postgres, in that order: this profile's
# postinst asserts against files rds-common delivers.
[Content]
# No postgresql-contrib-18: Debian and Ubuntu ship the contrib modules inside
# postgresql-18 itself, unlike Alpine's separate package. pgvector stays baked
# for the Ochre appliance and is inert until a CREATE EXTENSION runs.
Packages=postgresql-18
         postgresql-client-18
         postgresql-18-pgvector

ExtraTrees=rds-init:/usr/local/sbin/rds-init
