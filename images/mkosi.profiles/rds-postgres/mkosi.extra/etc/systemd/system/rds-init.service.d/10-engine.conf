# Ubuntu's engine paths, declared rather than edited into a 900-line bootstrap
# script: rds-init already honours every one of these as an override.
# RDS_PG_BIN is the one that must be set — the script's built-in default is
# Alpine's /usr/libexec/postgresql18, which does not exist here.
#
# EnvironmentFile= stays below Environment= so a delivered value still wins.
[Service]
Environment=RDS_DATA_MOUNT=/var/lib/postgresql
Environment=RDS_PG_BIN=/usr/lib/postgresql/18/bin
EnvironmentFile=-/etc/spinifex-rds/agent.env

[Unit]
Before=spinifex-postgresql.service
