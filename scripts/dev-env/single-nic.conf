# single-nic.conf — every plane collapsed onto the WAN bridge.
#
# The eval / laptop layout, and what an ISO install produces on a one-NIC box.
# Leaving lan and vpc unset is what triggers the collapse: both resolve up the
# chain to wan, so bind, advertise and encap all land on the one address.
#
# Usable on a multi-NIC box to test the collapsed path without touching netplan
# — the other bridges keep their addresses, nothing is bound to them.

DEV_WAN_BRIDGE=br-wan
DEV_LAN_BRIDGE=
DEV_VPC_BRIDGE=

DEV_MGMT_BRIDGE=br-mgmt
DEV_MGMT_CIDR=10.15.8.1/24

DEV_UPLINK=bridged

# Binding to the lan plane is meaningless when lan is wan: it would pin every
# internal service to the public address rather than leaving it on the wildcard.
DEV_BIND_PLANES=0
