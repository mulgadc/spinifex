# three-plane.conf — wan, lan and vpc each on their own NIC.
#
# The colo layout (radon, hydrogen) and the local dev box. Internal cluster
# traffic and Geneve are both off the public interface, so this is the profile
# that actually exercises the plane model.

DEV_WAN_BRIDGE=br-wan
DEV_LAN_BRIDGE=br-lan
DEV_VPC_BRIDGE=br-vpc

# Guest→host bridge for system instances. Orthogonal to the three planes and
# never folded into lan — keep it off the plane bridge names.
DEV_MGMT_BRIDGE=br-mgmt
DEV_MGMT_CIDR=10.15.8.1/24

DEV_UPLINK=bridged
DEV_BIND_PLANES=1
