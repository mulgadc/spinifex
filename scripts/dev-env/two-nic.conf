# two-nic.conf — dedicated WAN, with lan and vpc sharing the second NIC.
#
# The typical small-production layout. vpc is left unset so it folds onto lan:
# Geneve and internal cluster traffic share a bridge, but both stay off the
# public interface.

DEV_WAN_BRIDGE=br-wan
DEV_LAN_BRIDGE=br-lan
DEV_VPC_BRIDGE=

DEV_MGMT_BRIDGE=br-mgmt
DEV_MGMT_CIDR=10.15.8.1/24

DEV_UPLINK=bridged
DEV_BIND_PLANES=1
