IMAGE_NAME="rds-mariadb"
IMAGE_DESCRIPTION="Spinifex RDS MariaDB instance — Alpine + MariaDB 11.8"
DISTRO="alpine"
ALPINE_VERSION="3.24.1"

# Engine binaries and per-boot diagnostics only. The datadir lives on the data
# volume, so the boot volume stays a disposable COW clone.
IMAGE_SIZE="2G"

# Alpine's mariadb package name carries no version, unlike postgresql18, so the
# fuzzy pin is what keeps a rebuild on this series: =~11.8 admits a patch release
# and refuses a series bump, which would otherwise produce an image tagged
# engine-version=11.8 running 11.9. mariadb-common carries my.cnf and the charset
# and error-message data; the client package carries the binaries the agent
# probes and rotates passwords with.
# blkid is a hard requirement — without it rds-datadir refuses to run rather
# than risk formatting a customer's datadir.
APK_PACKAGES="mariadb=~11.8 mariadb-client=~11.8 mariadb-common=~11.8 mariadb-openrc=~11.8 ca-certificates cloud-utils-growpart e2fsprogs-extra xfsprogs blkid openrc"

# rds-agent is the only built binary (static, FIPS boot like the host build).
BUILD_COMMANDS="CGO_ENABLED=0 GOFIPS140=v1.0.0 go build -ldflags \"-s -w\" -o bin/rds-agent ./cmd/rds-agent"

INSTALL_BINARIES="bin/rds-agent:/usr/local/bin/rds-agent"

# mulga-mgmt-net is shared with eks-node: this is a three-NIC system VM (system
# ENI, customer ENI, mgmt0), so the host's fw_cfg netcfg blob needs a consumer in
# the guest, or mgmt0 never gets its static address and rds-agent cannot reach
# the gateway, and the customer ENI never comes up so nothing reaches the DB.
INSTALL_FILES="\
scripts/images/common/rds-datadir:/usr/local/sbin/rds-datadir \
scripts/images/rds-mariadb/rds-datadir.initd:/etc/init.d/rds-datadir \
scripts/images/rds-mariadb/rds-agent.initd:/etc/init.d/rds-agent \
scripts/images/common/mulga-mgmt-net.initd:/etc/init.d/mulga-mgmt-net \
scripts/images/common/mulga-mgmt-net-routes.initd:/etc/init.d/mulga-mgmt-net-routes \
scripts/images/common/mulga-mgmt-net.sh:/usr/local/sbin/mulga-mgmt-net \
scripts/images/rds-mariadb/zz-rds-include.cnf:/etc/my.cnf.d/zz-rds-include.cnf"

# Each service's own depend() asserts the ordering; this lists it to match.
# mulga-mgmt-net is NOT here: setup.sh adds it to the boot runlevel, since a
# default-runlevel entry would run after cloud-init-local and be too late. Its
# route-enforcement second pass is the opposite — it has to follow cloud-init, so
# the default runlevel is exactly where it belongs.
#
# mariadb is deliberately absent while this image has no bootstrap: the packaged
# service only warns about an empty datadir instead of refusing, so an enabled
# engine would launch mysqld_safe against an unbootstrapped data volume.
ENABLE_SERVICES="rds-datadir rds-agent mulga-mgmt-net-routes"

SETUP_SCRIPT="scripts/images/rds-mariadb/setup.sh"

AMI_NAME="spinifex-rds-mariadb"

# The contract tag prevents the control plane from issuing a format grant to an
# older image that still discovers generic vol* devices.
SYSTEM_TAG="spinifex:managed-by=rds engine=mariadb engine-version=11.8 rds-data-volume-contract=format-auth-v1"
