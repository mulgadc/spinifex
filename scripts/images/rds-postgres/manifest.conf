IMAGE_NAME="rds-postgres"
IMAGE_DESCRIPTION="Spinifex RDS PostgreSQL instance — Alpine + PostgreSQL 18 + rds-init first-boot bootstrap"
DISTRO="alpine"
ALPINE_VERSION="3.24.1"

# 2G root: engine binaries, ICU collation data and the postmaster log only. The
# datadir lives on the separate Viperblock data volume mounted at
# /var/lib/postgresql, so the boot volume never grows with customer data and
# stays a disposable COW clone that any VM replace can throw away.
IMAGE_SIZE="2G"

# PostgreSQL major version is pinned to 18 for v1 and surfaced as EngineVersion
# by the control plane; the openrc packages ship /etc/init.d/postgresql, whose
# conf.d this image replaces. icu-data-full is deliberate: the cluster is
# initialised with an ICU locale provider (musl has no libc locales), and the
# stock english-only ICU data would reject any other collation a customer asks
# for. cloud-utils-growpart + e2fsprogs-extra/xfsprogs bake the growpart /
# resize2fs / xfs_growfs tools the in-guest storage-grow path needs.
APK_PACKAGES="postgresql18 postgresql18-client postgresql18-contrib postgresql18-openrc postgresql-common-openrc icu-data-full ca-certificates cloud-utils-growpart e2fsprogs-extra xfsprogs openrc"

# rds-agent is the only built binary (static, FIPS boot like the host build).
BUILD_COMMANDS="CGO_ENABLED=0 GOFIPS140=v1.0.0 go build -ldflags \"-s -w\" -o bin/rds-agent ./cmd/rds-agent"

INSTALL_BINARIES="bin/rds-agent:/usr/local/bin/rds-agent"

INSTALL_FILES="\
scripts/images/rds-postgres/rds-datadir:/usr/local/sbin/rds-datadir \
scripts/images/rds-postgres/rds-datadir.initd:/etc/init.d/rds-datadir \
scripts/images/rds-postgres/rds-init:/usr/local/sbin/rds-init \
scripts/images/rds-postgres/rds-init.initd:/etc/init.d/rds-init \
scripts/images/rds-postgres/rds-agent.initd:/etc/init.d/rds-agent \
scripts/images/rds-postgres/postgresql.confd:/etc/conf.d/postgresql"

# rds-datadir mounts the attached data volume; rds-agent then delivers the
# bootstrap config; rds-init bootstraps or attaches the datadir on that volume;
# postgresql starts the engine for real. The ordering is asserted by each
# service's own depend(), and listed in that order here so the runlevel reads
# the way the boot runs.
ENABLE_SERVICES="rds-datadir rds-agent rds-init postgresql"

SETUP_SCRIPT="scripts/images/rds-postgres/setup.sh"

AMI_NAME="spinifex-rds-postgres"

# managed-by=rds marks it a system AMI; engine/engine-version are what the
# control plane resolves an EngineVersion request against.
SYSTEM_TAG="spinifex:managed-by=rds engine=postgres engine-version=18"
