# AWS Gateway configuration file in TOML format.
version = "3"
region = "{{.Region}}"

# Enable verbose debugging
debug = false

# API request throttling (per-account, per-action token bucket)
[ratelimit]
enabled = false
rate = 20 # Default sustained requests per second per account per action
burst = 100 # Default maximum burst capacity

[ratelimit.action.RunInstances]
rate = 2
burst = 40

[ratelimit.action.TerminateInstances]
rate = 2
burst = 40

[ratelimit.action.StartInstances]
rate = 2
burst = 40

[ratelimit.action.StopInstances]
rate = 2
burst = 40

# API request throttling for self-service account creation.
[ratelimit.action.CreateAccount]
rate = 1
burst = 5

# Self-service account creation via POST /admin/CreateAccount.
# max_accounts caps how many accounts may exist; 0 means uncapped, and an
# absent section defaults to 128. The endpoint is unreachable until an IAM user
# in the super-admin account is granted spinifex:CreateAccount, so this value
# alone does not expose it.
[signup]
max_accounts = 128

# Per-account service quotas (default off). These values are the baseline every
# account inherits; raise an individual account with
# `spx admin account quota set`, which stores an override in NATS KV.
# A dimension set to -1 is uncapped for accounts that inherit it.
[quota]
enabled = false
vcpus = 16
vpcs = 4
subnets = 16
eips = 4
volumes = 16
volumes_gib = 200
rds_instances = 2
load_balancers = 2
