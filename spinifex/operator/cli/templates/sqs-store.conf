# spinifex-config-version: 1
# Dedicated SQS message store (JetStream)
# Generated by Spinifex admin init
# Shares no port, directory, account, token or route with nats.conf.

server_name: spinifex-sqs-store-{{.Node}}

{{- if .BindIP }}
listen: {{.BindIP}}:4223
{{- else }}
listen: 0.0.0.0:4223
{{- end }}

tls {
  cert_file: "{{.ConfigDir}}/server.pem"
  key_file:  "{{.ConfigDir}}/server.key"
  ca_file:   "{{.ConfigDir}}/ca.pem"
}

{{- if and .ClusterBindIP .SQSStoreRoutes }}

cluster {
  name: {{ .ClusterName }}-sqs-store
  listen: {{.ClusterBindIP}}:4249

  authorization {
    user: sqs-store-route
    password: "{{.SQSStoreToken}}"
  }

  tls {
    cert_file: "{{.ConfigDir}}/server.pem"
    key_file:  "{{.ConfigDir}}/server.key"
    ca_file:   "{{.ConfigDir}}/ca.pem"
    verify:    true
  }

  routes = [
{{- range .SQSStoreRoutes }}
    "nats-route://sqs-store-route:{{$.SQSStoreToken}}@{{ . }}",
{{- end }}
  ]
}
{{- end }}

authorization {
  token: "{{.SQSStoreToken}}"
}

jetstream {
  # Every acknowledgement follows a completed fsync.
  sync_interval: always
  store_dir: "{{.DataDir}}/sqs-store/"
  max_memory_store: 256MB
  max_file_store: 10GB
}

debug: false
trace: false
logtime: true
log_file: "{{.LogDir}}/sqs-store.log"

# A 1 MiB body with 10 attributes, headers and framing.
max_connections: 1000
max_payload: 2MB
max_pending: 64MB

http: 127.0.0.1:8223
